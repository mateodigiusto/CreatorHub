/* ---- 05-brain.js ---- */
/* ===================== Claude, through the CreatorHub server =====================
   The page holds no prompts and no editing rules. CreatorHub is the interface; the work runs in the creator's own
   Claude Code, on their own Claude plan. The page puts work in a queue on the CreatorHub server, Claude Code takes it
   from there with its instructions, and the result comes back here. */
const BRAIN = {url:String((window.CH_CONFIG && window.CH_CONFIG.brain) || "").replace(/\/$/, ""), code:"", key:"", serverKey:null, allowance:null, worker:null, queue:null};
const BRAIN_LIMITS = {status:8000, job_get:15000, job_list:15000, job_create:60000, job_cancel:15000, job_retry:15000, job_delete:15000};
const DIRECT = new Set(Object.keys(BRAIN_LIMITS));
const TASKS = {script_write:"Write a script", script_humanize:"Make a script sound like you", competitor_analyze:"Study a competitor", competitor_extract:"Read a competitor’s posts", posts_extract:"Read your posts", hooks_tag:"Tag your hooks", numbers_read:"Read your numbers", lesson_teacher:"Answer a lesson question", profile_scan:"Read your profile"};
function brainLoad(){ const b = pref("brain", null) || {}; BRAIN.code = String(b.code || ""); BRAIN.key = String(b.key || ""); BRAIN.serverKey = typeof b.serverKey === "boolean" ? b.serverKey : null; BRAIN.queue = typeof b.queue === "boolean" ? b.queue : null; BRAIN.worker = b.seen ? {seenAt:String(b.seen), active:false} : null; }
function brainSave(){ setPref("brain", {code:BRAIN.code, key:BRAIN.key, serverKey:BRAIN.serverKey, queue:BRAIN.queue, seen:(BRAIN.worker && BRAIN.worker.seenAt) || ""}); }
function apiOK(){ return !!(BRAIN.key || BRAIN.serverKey); }
function codeSeen(){ return !!(BRAIN.worker && BRAIN.worker.seenAt); }
function codeActive(){ return !!(BRAIN.worker && BRAIN.worker.active); }
function brainState(){
  if (!BRAIN.url) return "absent"; if (!BRAIN.code) return "nocode";
  if (codeSeen()) return codeActive() ? "connected" : "ready";
  if (apiOK()) return "ready";
  if (BRAIN.serverKey === null) return "unknown";
  return BRAIN.queue === false ? "soon" : "waiting";
}
function setInvite(code){ BRAIN.code = String(code || "").trim(); BRAIN.serverKey = null; BRAIN.worker = null; BRAIN.queue = null; brainSave(); markClaude(brainState()); }
function inviteFromUrl(){
  const m = /[#&?]invite=([A-Za-z0-9-]{8,80})/.exec((location.hash || "") + "&" + (location.search || "")); if (!m) return false;
  setInvite(m[1]);
  try { history.replaceState(null, "", location.pathname); } catch (e){}
  return true;
}
function mcpUrl(){ return BRAIN.url + "/mcp"; }
function connectLine(){ return 'claude mcp add --transport http creatorhub --scope user ' + mcpUrl() + ' --header "Authorization: Bearer ' + BRAIN.code + '"'; }
/* A link that opens Claude Code with the line already typed. The creator still presses Enter. */
function claudeLink(folder){ return "claude-cli://open?" + (folder ? "cwd=" + encodeURIComponent(folder) + "&" : "") + "q=" + encodeURIComponent("Run my CreatorHub queue"); }

function claudeOK(){ return S.claude.status === "ready" || S.claude.status === "connected"; }
function markClaude(st, why){
  if (S.claude.status === st && (S.claude.why || "") === (why || "")) return;
  S.claude.status = st; S.claude.why = why || "";
  if ((st === "connected" || st === "ready") && S.profile && !S.profile.claudeConnectedAt) setProfile({claudeConnectedAt:new Date().toISOString()});
  scheduleRender();
}
function claudeFail(e){
  const c = e && e.code;
  if (c === "no_access") markClaude(BRAIN.code ? "denied" : "nocode", "code"); else if (c === "invite_off") markClaude("denied", "off");
}
function claudeCopy(e){
  const code = e && e.code;
  if (code === "cancelled") return "";
  if (code === "no_access") return "This invite isn’t valid. Ask for a new invite link.";
  if (code === "invite_off") return "This invite has been switched off.";
  if (code === "job_failed") return (e.message || "Claude Code couldn’t finish that.") + " Try again.";
  if (code === "queue_off") return "Running work through Claude Code is being switched on. Try again a little later.";
  if (code === "queue_full") return "A lot is already waiting. Let Claude Code finish some of it first.";
  if (code === "limit_day") return "Today’s allowance is used up. It resets at midnight UTC.";
  if (code === "limit_month") return "This month’s allowance is used up. It resets on the 1st.";
  if (code === "limit_global") return "CreatorHub is at its monthly limit. Try again next month.";
  if (code === "busy") return "The server is busy. Try again in a minute.";
  if (code === "no_key" || code === "not_available") return "Connect Claude Code first. It takes two minutes, under Settings.";
  if (code === "bad_key" || code === "no_credit") return "Claude is switched off on CreatorHub’s side right now. Try again later.";
  if (code === "rate_limited") return "Too many requests right now. Try again in a minute.";
  if (code === "overloaded") return "Claude is busy right now. Try again in a minute.";
  if (code === "refused") return "Claude declined this one. Change the brief and try again.";
  if (code === "invalid_json" || code === "too_long") return "The answer came back in an unexpected shape. Try again.";
  if (code === "too_large") return "That’s too much to send at once. Use fewer or smaller files.";
  if (code === "network") return "Couldn’t reach the CreatorHub server. Check your connection and try again.";
  return "That didn’t finish. Try again.";
}

async function imagePart(blob, max){
  let b = blob; max = max || 1568;
  try {
    const bmp = await createImageBitmap(blob); const r = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (r < 1 || !/^image\/(jpeg|png|webp)$/.test(blob.type || "") || blob.size > (max < 1500 ? 300000 : 1200000)){
      const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(bmp.width * r)); c.height = Math.max(1, Math.round(bmp.height * r)); c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
      b = (await new Promise(res => c.toBlob(res, "image/jpeg", max < 1500 ? 0.8 : 0.85))) || blob;
    }
  } catch (e){}
  const buf = new Uint8Array(await b.arrayBuffer()); let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return {media_type:/^image\/(jpeg|png|webp|gif)$/.test(b.type || "") ? b.type : "image/jpeg", data:btoa(bin)};
}
/* One request to the CreatorHub server. Nothing here may hang: every request has a time limit. */
async function brainPost(skill, vars, o){
  o = o || {};
  if (!BRAIN.url) throw {code:"not_available"};
  if (!BRAIN.code){ markClaude("nocode"); throw {code:"no_access"}; }
  const body = {skill, vars:vars || {}};
  if (o.images && o.images.length) body.images = await Promise.all([...o.images].slice(0, o.small ? 4 : 14).map(f => imagePart(f, o.small ? 1100 : 1568)));
  if (o.tail && o.tail.length) body.tail = o.tail;
  const headers = {"content-type":"application/json", "x-studio-code":BRAIN.code}; if (BRAIN.key) headers["x-claude-key"] = BRAIN.key;
  const ctl = new AbortController(); let late = false;
  const timer = setTimeout(() => { late = true; ctl.abort(); }, BRAIN_LIMITS[skill] || 300000);
  if (o.signal){ if (o.signal.aborted) ctl.abort(); else o.signal.addEventListener("abort", () => ctl.abort(), {once:true}); }
  let res, data = null;
  try { res = await fetch(BRAIN.url + "/", {method:"POST", headers, body:JSON.stringify(body), signal:ctl.signal}); try { data = await res.json(); } catch (e){ if (late || ctl.signal.aborted) throw e; } }
  catch (e){ throw {code:late ? "network" : e && e.name === "AbortError" ? "cancelled" : "network"}; }
  finally { clearTimeout(timer); }
  if (!data || !data.ok){ const err = {code:(data && data.code) || (res.status === 413 ? "too_large" : "upstream"), message:(data && data.message) || ""}; claudeFail(err); throw err; }
  return data;
}
/* Work for Claude. With an API key on the server the answer comes straight back; otherwise it goes in the queue
   and the creator's own Claude Code picks it up. Either way the caller just waits for the answer. */
const QUEUE = {pending:new Map()};
async function brainCall(skill, vars, o){
  if (DIRECT.has(skill) || apiOK()) return brainPost(skill, vars, o);
  return queueCall(skill, vars, o || {});
}
function waitMs(ms, signal){ return new Promise((res, rej) => { const t = setTimeout(res, ms); if (signal) signal.addEventListener("abort", () => { clearTimeout(t); rej({code:"cancelled"}); }, {once:true}); }); }
async function queueCall(skill, vars, o){
  if (!TASKS[skill]) throw {code:"not_available"};
  if (BRAIN.queue === false) throw {code:"queue_off"};
  const made = await brainPost("job_create", {kind:"skill", skill, title:TASKS[skill], vars:vars || {}}, {images:o.images, small:true, signal:o.signal});
  const id = made.job.id; const ctl = new AbortController();
  QUEUE.pending.set(id, {id, title:made.job.title, status:"queued", progress:"", cancel:() => ctl.abort()}); scheduleRender(); pulse();
  if (o.signal) o.signal.addEventListener("abort", () => ctl.abort(), {once:true});
  let misses = 0;
  try {
    for (;;){
      await waitMs(2500, ctl.signal);
      let j;
      try { j = (await brainPost("job_get", {id}, {signal:ctl.signal})).job; misses = 0; }
      catch (e){ if (e && (e.code === "cancelled" || e.code === "not_found" || e.code === "no_access")) throw e; if (++misses > 40) throw {code:"network"}; continue; }
      const p = QUEUE.pending.get(id); if (p && (p.status !== j.status || p.progress !== j.progress)){ p.status = j.status; p.progress = j.progress; scheduleRender(); }
      if (j.status === "done"){ const r = j.result || {}; return r.json !== undefined ? {ok:true, json:r.json} : {ok:true, text:String(r.text || "")}; }
      if (j.status === "failed") throw {code:"job_failed", message:String((j.result && j.result.reason) || "")};
      if (j.status === "cancelled") throw {code:"cancelled"};
    }
  } catch (e){ if (e && e.code === "cancelled") brainPost("job_cancel", {id}).catch(() => {}); throw e; }
  finally { QUEUE.pending.delete(id); scheduleRender(); }
}
async function skillJSON(skill, vars, o){ return (await brainCall(skill, vars, o)).json; }
async function skillText(skill, vars, o){ return {text:String((await brainCall(skill, vars, o)).text || "")}; }
/* A conversation where Claude asks the page to do things (add a task, move a piece). Only with an API key on the server. */
async function skillChat(skill, vars, tools, o){
  o = o || {}; let tail = []; let text = "";
  if (!apiOK()) throw {code:"not_available"};
  for (let round = 0; round < 12; round++){
    const r = await brainPost(skill, vars, {tail, signal:o.signal});
    const content = Array.isArray(r.content) ? r.content : [];
    const said = content.filter(b => b && b.type === "text").map(b => b.text).join("").trim(); if (said){ text = said; if (o.onText) o.onText({text}); }
    const calls = content.filter(b => b && b.type === "tool_use");
    if (r.stop !== "tool_use" || !calls.length) break;
    const results = [];
    for (const c of calls){
      const t = (tools || []).find(x => x.name === c.name); let out, bad = false;
      try { out = t ? await t.execute(c.input || {}) : {error:"That action does not exist here."}; } catch (e){ out = {error:String((e && e.message) || e || "failed")}; bad = true; }
      results.push({type:"tool_result", tool_use_id:c.id, content:JSON.stringify(out === undefined ? null : out).slice(0, 20000), ...(bad ? {is_error:true} : {})});
    }
    tail = [...tail, {role:"assistant", content}, {role:"user", content:results}];
  }
  return {text};
}
/* Ask the server: is this invite good, and has Claude Code connected? */
let brainRun = 0, brainRetryT = 0, brainRetries = 0;
function brainTake(r){ BRAIN.serverKey = !!r.serverKey; BRAIN.allowance = r.allowance || null; BRAIN.worker = r.worker && r.worker.seenAt ? {seenAt:r.worker.seenAt, active:!!r.worker.active} : null; BRAIN.queue = r.queue === true; BRAIN.instagram = r.instagram === true; brainSave(); markClaude(brainState()); }
async function brainCheck(quiet){
  if (!BRAIN.url){ markClaude("absent"); return false; }
  if (!BRAIN.code){ markClaude("nocode"); return false; }
  if (quiet){ try { brainTake(await brainPost("status")); return true; } catch (e){ return false; } }
  clearTimeout(brainRetryT);
  const run = ++brainRun;
  if (S.claude.status === "offline") markClaude("unknown");
  for (let i = 0; i < 3; i++){
    try { const r = await brainPost("status"); if (run !== brainRun) return true; brainRetries = 0; brainTake(r); return true; }
    catch (e){
      const c = e && e.code; if (run !== brainRun) return false;
      if (c === "no_access" || c === "invite_off") return false;
      if (i < 2) await new Promise(res => setTimeout(res, 900 * (i + 1)));
    }
  }
  if (run !== brainRun) return false;
  // Three tries failed. Say so, and keep trying quietly in the background.
  if (S.claude.status === "unknown") markClaude("offline");
  if (brainRetries++ < 6) brainRetryT = setTimeout(() => brainCheck(), 20000);
  return false;
}
/* Keep an eye on the connection: every few seconds while something is waiting or the connect steps are on screen, rarely otherwise. */
let pulseOn = false, pulseBusy = false, pulseN = 0;
function pulse(){
  if (pulseOn) return; pulseOn = true;
  setInterval(async () => {
    if (document.hidden || !BRAIN.code || pulseBusy || ["denied", "nocode", "absent", "offline"].includes(S.claude.status)) return;
    const fast = QUEUE.pending.size > 0 || EDJ.watching || !!document.querySelector(".cn-steps, #cn-soon, #ed-soon, #ed-connect");
    if (!fast && ++pulseN % 14) return;
    pulseBusy = true; try { await brainCheck(true); } finally { pulseBusy = false; }
  }, 3000);
}

/* ---------- Storage: this browser. Nothing here leaves the device. ---------- */
function localDb(){
  const docs = new Map(); const listeners = []; let idb = null;
  const meta = {fromCache:false, hasPendingWrites:false};
  const isChild = (col, p) => p.startsWith(col + "/") && p.slice(col.length + 1).indexOf("/") < 0;
  const snapDoc = p => { const d = docs.get(p); return {id:p.split("/").pop(), exists:d !== undefined, data:() => d, metadata:meta}; };
  const snapCol = c => { const list = [...docs.keys()].filter(k => isChild(c, k)).map(snapDoc); return {docs:list, size:list.length, empty:!list.length, docChanges:() => [], metadata:meta}; };
  const notify = p => { for (const l of [...listeners]) if (l.isCol ? isChild(l.path, p) : l.path === p) l.fn(l.isCol ? snapCol(l.path) : snapDoc(l.path)); };
  const store = (p, d) => { if (!idb) return; try { const os = idb.transaction("docs", "readwrite").objectStore("docs"); if (d === undefined) os.delete(p); else os.put(d, p); } catch (e){} };
  const ready = new Promise(res => {
    setTimeout(res, 4000);
    try {
      const rq = indexedDB.open("creatorhub-studio", 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore("docs");
      rq.onerror = () => res(); rq.onblocked = () => res();
      rq.onsuccess = () => { idb = rq.result; try { const tx = idb.transaction("docs", "readonly"); const cur = tx.objectStore("docs").openCursor(); cur.onsuccess = () => { const c = cur.result; if (c){ docs.set(String(c.key), c.value); c.continue(); } }; tx.oncomplete = () => res(); tx.onerror = () => res(); tx.onabort = () => res(); } catch (e){ res(); } };
    } catch (e){ res(); }
  });
  const sub = (path, isCol, fn) => { const l = {path, isCol, fn}; listeners.push(l); ready.then(() => { if (listeners.includes(l)) fn(isCol ? snapCol(path) : snapDoc(path)); }); return () => { const i = listeners.indexOf(l); if (i >= 0) listeners.splice(i, 1); }; };
  const db = {
    ready,
    doc(p){ return {id:p.split("/").pop(), path:p, get:async () => { await ready; return snapDoc(p); },
      set:async d => { const v = JSON.parse(JSON.stringify(d)); docs.set(p, v); store(p, v); notify(p); },
      update:async d => { const v = {...(docs.get(p) || {}), ...JSON.parse(JSON.stringify(d))}; docs.set(p, v); store(p, v); notify(p); },
      delete:async () => { docs.delete(p); store(p, undefined); notify(p); },
      onSnapshot:fn => sub(p, false, fn)}; },
    collection(c){ return {path:c, doc:id => db.doc(c + "/" + (id || uid("d"))), get:async () => { await ready; return snapCol(c); }, onSnapshot:fn => sub(c, true, fn)}; },
  };
  return db;
}

  const onErr = e => { clearTimeout(slowT); if (e && e.code === "revoked"){ S.mode = "demo"; S.demoReason = "readonly"; } else if (S.mode === "loading") S.mode = "live"; render(); };
  db.doc(root + "/profile").onSnapshot(snap => {
    S.profile = snap.exists ? snap.data() : null;
    if (!snap.metadata.fromCache){ S.profileLoaded = true; S.slow = false; clearTimeout(slowT); }
    if (first || S.mode === "loading"){ first = false; S.mode = "live"; }
    scheduleRender(); maybeAutopilot(); purgeExamples();
  }, onErr);
  db.doc(root + "/progress").onSnapshot(snap => { S.progress = snap.exists ? snap.data() : {done:{}}; scheduleRender(); }, () => {});
  for (const col of USER_COLS){
    db.collection(root + "/ws/" + col).onSnapshot(snap => {
      const m = new Map(); for (const d of snap.docs) if (d.exists) m.set(d.id, {id:d.id, ...d.data()});
      S.col[col] = m; S.loaded[col] = true; scheduleRender(); maybeAutopilot(); purgeExamples();
    }, onErr);
  }
}
function purgeExamples(){
  if (S.purged || !S.profile || !S.profileLoaded || S.mode !== "live") return;
  if (S.profile.examplesOk){ S.purged = true; return; }
  if (!COLS.every(c => S.loaded[c])) return;
  S.purged = true;
  if (!hasExamples()) return;
  for (const col of COLS) for (const d of listCol(col)) if (d.example) remove(col, d.id);
  toast("Example data removed. Everything you see now is yours.");
}
function maybeAutopilot(){
  if (!FEATURES.posts) return;
  if (S.autoFilled || !S.profile || !S.profileLoaded || !S.loaded.queue || S.mode !== "live") return;
  const ap = autopilot(); if (!ap.on || !ap.auto || !claudeOK()) return;
  if (!plannedDates(7).some(d => !queueFor(d))) return;
  S.autoFilled = true;
  setTimeout(() => { fillQueue(7, {limit:3}); }, 1500);
}
(async function boot(){
  brainLoad(); inviteFromUrl();
  readHash();
  window.addEventListener("hashchange", () => { if (inviteFromUrl()){ brainCheck(); } readHash(); closeAllLayers(); render(); window.scrollTo(0, 0); });
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); if (S.profile && apiOK()) openAssistant(); }
    if (e.key === "Escape" && Layers.stack.length) closeLayer();
  });
  S.ui.lastVisit = pref("lastVisit", null); setPref("lastVisit", new Date().toISOString());
  const db = localDb();
  S.caps = {db, user:null, sample:null, downloads:null, mcp:null};
  S.me = {id:"me", name:""}; S.meId = "me"; S.isOwner = true; S.canAdmin = false; S.canWrite = true;
  S.claude.status = brainState();
  loadSharedSeeds();
  render();
  brainCheck(); pulse();
  window.addEventListener("online", () => { if (!claudeOK()) brainCheck(); });
  await db.ready;
  subscribeUser(db);
  render();
})();

})();
</script>
