  --inset:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(0,0,0,.28);

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg-glow),var(--bg);background-attachment:fixed;color:var(--ink);font:400 13.5px/1.5 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.006em;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
@keyframes shimmer{from{background-position:-200px 0}to{background-position:200px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.4}}
#view.enter > *{animation:fadeUp .32s cubic-bezier(.2,.7,.2,1) both}
#view.enter > *:nth-child(2){animation-delay:.04s} #view.enter > *:nth-child(3){animation-delay:.08s} #view.enter > *:nth-child(4){animation-delay:.12s} #view.enter > *:nth-child(n+5){animation-delay:.16s}
.scrim{animation:fadeIn .2s both}
.drawer,.assist{animation:slideIn .28s cubic-bezier(.2,.7,.2,1) both}
.modal{animation:popIn .22s cubic-bezier(.2,.7,.2,1) both}
.sheet{animation:sheetIn .28s cubic-bezier(.2,.7,.2,1) both}
.viz .bar{transform-origin:bottom;animation:grow .5s cubic-bezier(.2,.7,.2,1) both}
.viz.h .bar{transform-origin:left;animation-name:growX}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--ink-2);border-radius:50%;animation:spin 1s linear infinite;flex:none}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;
  padding:12px 10px 12px max(10px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(28px) saturate(140%);-webkit-backdrop-filter:blur(28px) saturate(140%);overflow-y:auto;scrollbar-width:thin}
.ws{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;border:1px solid transparent;text-align:left;background:none;width:100%;min-width:0;transition:background .15s,border-color .15s}
.ws:hover{background:var(--hover);border-color:var(--line)}
.ws .nm{min-width:0;flex:1}
.ws .nm b{display:block;font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.ws .nm span{display:block;font-size:11.5px;line-height:1.3;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws svg.chev{color:var(--ink-3);width:14px;height:14px}
.logo{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none;font-weight:700;font-size:14px;letter-spacing:-.02em;
  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.45)}
.tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none;--hue:var(--h-settings);background:linear-gradient(145deg,color-mix(in srgb,var(--hue) 72%,transparent),color-mix(in srgb,var(--hue) 30%,transparent));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),inset 0 -1px 0 rgba(0,0,0,.25),0 6px 16px color-mix(in srgb,var(--hue) 22%,transparent)}
.tile svg{width:19px;height:19px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.tile.sm{width:28px;height:28px;border-radius:8px}
.tile.sm svg{width:14px;height:14px}
.tile.lg{width:52px;height:52px;border-radius:14px}
.tile.lg svg{width:24px;height:24px}
.srch{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass-flat);box-shadow:var(--inset);color:var(--ink-3);font-size:13px;text-align:left;width:100%;transition:border-color .15s,background .15s}
.srch:hover{border-color:var(--line-2);color:var(--ink-2)}
.srch span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:1px 6px;color:var(--ink-3);background:var(--glass-2)}
.tree{display:grid;gap:14px}
.tree-top{display:grid;gap:1px}
.tree-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border:0;background:none;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:13px;text-align:left;width:100%;position:relative;transition:background .12s,color .12s}
.tree-item svg{color:var(--ink-3);width:17px;height:17px}
.tree-item:hover{background:var(--hover);color:var(--ink)}
.tree-item[aria-current="page"]{background:linear-gradient(90deg,rgba(255,255,255,.11),rgba(255,255,255,.04));color:var(--ink);box-shadow:var(--inset),0 0 0 1px var(--line)}
.tree-item[aria-current="page"]::after{content:"";position:absolute;right:8px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--ink);opacity:.7}
.tree-item[aria-current="page"] svg{color:var(--ink)}
.tree-item .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tree-item .count.badge{color:#fff;background:var(--accent);border-radius:999px;padding:1px 6px;min-width:18px;text-align:center;font-weight:600;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tree-item .count.hot{color:var(--bad)}
.tree-item .beta{font-size:10px;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border-radius:5px;padding:2px 5px;letter-spacing:.02em}
.tree-g{display:grid;gap:1px}
.tree-gl{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tree-gh{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 6px;border:0;background:none;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:13px;text-align:left;width:100%;transition:background .12s,color .12s}
.tree-gh:hover{background:var(--hover);color:var(--ink)}
.tree-gh[aria-current="page"]{color:var(--ink)}
.tree-gh .chev{width:14px;height:14px;color:var(--ink-3);transition:transform .18s;flex:none}
.tree-gh[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tree-gh .lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-gh .count{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tree-sub{display:grid;gap:1px;margin-left:19px;padding-left:10px;border-left:1px solid var(--line);animation:fadeIn .18s both}
.tree-sub .tree-item{padding:6px 10px;font-size:12.5px;font-weight:450}
.tree-sub .tree-item svg{width:15px;height:15px}
.rail-foot{margin-top:auto;display:grid;gap:2px;padding-top:8px;border-top:1px solid var(--line)}

.status:hover{background:var(--hover);color:var(--ink)}
.status .led{width:7px;height:7px;border-radius:50%;background:var(--ink-3);flex:none}
.status.on .led{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.status.off .led{background:var(--bad)}

.av{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:none;background:var(--sunk)}
.avs{display:flex}
.avs .av{width:22px;height:22px;border:2px solid var(--panel);margin-left:-6px}
.avs .av:first-child{margin-left:0}
.avi{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;background:linear-gradient(145deg,#6B7280,#374151);flex:none}

.main{min-width:0;display:flex;flex-direction:column}
.main > *{min-width:0}
.main{padding:12px max(28px,env(safe-area-inset-right,0px)) 72px 28px;gap:18px}
.crumbs{display:flex;align-items:center;gap:10px;min-height:40px;flex-wrap:wrap}
.crumbs .path{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-3);min-width:0}

.crumbs .grow{flex:1}
.crumbs .ctl.search{max-width:280px}
.topbar{display:none}
.tabbar{display:none}

.banner{padding:10px 14px;border-radius:10px;background:var(--glass-2);border:1px solid var(--line);color:var(--ink-2);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner svg{color:var(--ink-3)}

/* ---------- Type ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
h1,.h1{font-size:26px;line-height:1.15;font-weight:600;letter-spacing:-.03em;margin:0;text-wrap:balance}
h2,.h2{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.015em;margin:0;text-wrap:balance}
h3,.h3{font-size:14px;line-height:1.35;font-weight:600;letter-spacing:-.01em;margin:0}
.lede{color:var(--ink-2);margin:6px 0 0;max-width:64ch;font-size:13.5px}

p{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--glass);box-shadow:var(--inset);font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;line-height:1.2;color:var(--ink);transition:background .15s,border-color .15s,transform .15s;backdrop-filter:blur(10px)}
.btn svg{width:16px;height:16px}
.btn:hover{background:var(--hover);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 6px 16px rgba(0,0,0,.35)}
.btn.primary:hover{filter:brightness(.92)}
.btn.ai{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,white),var(--accent));border-color:transparent;color:var(--accent-ink);font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(76,141,255,.25)}
.btn.ai:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{border-color:transparent;background:none;box-shadow:none;backdrop-filter:none}
.btn.ghost:hover{background:var(--hover)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn.sm svg{width:14px;height:14px}
.btn.icon{padding:7px;border-radius:8px}
.btn.icon.sm{padding:5px}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.wide{width:100%}
.in,.f input:not([type="checkbox"]):not([type="range"]):not([type="color"]),.f select,.f textarea{border:1px solid var(--line-2);background:var(--sunk);border-radius:9px;padding:8px 11px;width:100%;min-width:0;font-size:13.5px;transition:border-color .15s,box-shadow .15s}
.in:focus,.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f{display:grid;gap:6px;min-width:0}
.f > label,.f > .lbl{font-size:12px;font-weight:500;color:var(--ink-2)}
.f textarea{min-height:92px;resize:vertical;line-height:1.5}
.f .help{font-size:12px;color:var(--ink-3)}
.f input[type="color"]{width:44px;height:32px;padding:2px;border:1px solid var(--line-2);border-radius:7px;background:var(--sunk)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl{height:34px;border:1px solid var(--line-2);background:var(--sunk);border-radius:9px;padding:0 10px;font-size:13px;min-width:0;max-width:100%}
.search{flex:1 1 180px;max-width:300px}
.toggle{height:32px;border:1px solid var(--line-2);background:var(--glass-2);border-radius:999px;padding:0 12px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.toggle[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-size:13.5px;transition:color .12s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.segm{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.segm button{border:0;background:none;padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--ink-2);transition:background .15s,color .15s}
.segm button[aria-selected="true"]{background:var(--glass-2);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line-2);background:var(--glass-2);border-radius:999px;padding:6px 12px;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);transition:all .15s}
.seg button svg{width:14px;height:14px}
.seg button .sw{width:8px;height:8px;border-radius:50%;background:var(--stage,var(--ink-3))}
.seg button:hover{border-color:var(--ink-3);color:var(--ink)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:500}
.seg.stages button[aria-pressed="true"]{border-color:var(--stage);background:color-mix(in srgb,var(--stage) 16%,transparent);color:var(--ink)}
.seg button:disabled{cursor:default;opacity:.6}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:4px 8px;border-radius:999px;background:var(--glass-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;max-width:100%}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--hue,var(--ink-3));flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:3px 8px;border-radius:999px;white-space:nowrap;background:color-mix(in srgb,var(--stage,var(--ink-3)) 16%,transparent);color:var(--stage,var(--ink-2))}
.pill .sw{width:6px;height:6px;border-radius:50%;background:var(--stage)}
.pill.good{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ai{background:var(--accent-soft);color:var(--accent-text)}
.pill.ex{background:var(--glass-2);color:var(--ink-3);border:1px solid var(--line)}
.pill.neutral{background:var(--glass-2);color:var(--ink-2);border:1px solid var(--line)}
label.check{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
label.check input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.sw-row{display:flex;gap:6px;flex-wrap:wrap}
.sw-row button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sw-row button[aria-pressed="true"]{border-color:var(--ink)}

/* ---------- Surfaces ---------- */
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;box-shadow:var(--inset),0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);position:relative}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.07),transparent 38%)}
.card > *{position:relative}
.card.sunk{background:var(--sunk);box-shadow:none}
.card.sunk::before{display:none}
.card.pad-s{padding:12px}
.card.lift{transition:transform .18s,border-color .18s,background .18s}
.card.lift:hover{transform:translateY(-1px);border-color:var(--line-2);background:var(--glass-2)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .h3{margin-right:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start}
.stack-s{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;align-content:start}
.list{display:grid;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--inset);min-width:0;text-align:left;width:100%;transition:background .12s,border-color .12s}
.lrow:hover{border-color:var(--line-2);background:var(--hover)}
.lrow .t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.lrow .m{font-size:11.5px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.empty{border:1px dashed var(--line-2);border-radius:16px;padding:28px 24px;display:grid;gap:12px;justify-items:start;max-width:760px;background:var(--glass-flat)}
.empty h2{font-size:18px}
.empty p{color:var(--ink-2);max-width:56ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px;width:100%}
.step{background:var(--glass);border-radius:10px;padding:12px 13px;display:grid;gap:6px;border:1px solid var(--line)}
.step .k{font-size:12px;font-weight:600;color:var(--accent-text)}
.step b{font-size:13.5px;font-weight:600}
.step span{font-size:12.5px;color:var(--ink-2)}
.loading{color:var(--ink-3);padding:48px 4px;font-size:13px;display:flex;gap:10px;align-items:center}
.skeleton{border-radius:10px;background:linear-gradient(90deg,var(--glass) 0,var(--glass-2) 50%,var(--glass) 100%);background-size:400px 100%;animation:shimmer 1.2s linear infinite}
.stat{display:grid;gap:6px;padding:14px 16px;background:var(--glass);border:1px solid var(--line);border-radius:16px;min-width:0;position:relative;overflow:hidden;box-shadow:var(--inset),0 10px 30px rgba(0,0,0,.25);backdrop-filter:blur(22px) saturate(150%)}
.stat::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.07),transparent 38%)}
.stat > *{position:relative}
.stat .l{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.stat .l svg{color:var(--ink-3);width:15px;height:15px}
.stat .v{font-size:28px;line-height:1.1;font-weight:600;letter-spacing:-.03em}
.stat .d{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;color:var(--ink-3);background:var(--glass-2);border:1px solid var(--line);border-radius:999px;padding:3px 8px;justify-self:start;font-variant-numeric:tabular-nums}
.stat .d.up{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.stat .d.down{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.stat .spark{margin-top:4px}
.iconbox{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);color:var(--ink-2);flex:none}
.iconbox svg{width:18px;height:18px}

/* Folders (modules) and files (recent) */
.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),340px));gap:12px}
.folder{display:grid;gap:10px;text-align:left;padding:14px 14px 12px;border-radius:18px;border:1px solid var(--line);background:var(--glass);min-width:0;position:relative;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s;backdrop-filter:blur(22px) saturate(150%);box-shadow:var(--inset),0 10px 30px rgba(0,0,0,.25)}
.folder::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(118deg,rgba(255,255,255,.07),transparent 40%)}
.folder > *{position:relative}
.folder:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--inset),0 18px 40px rgba(0,0,0,.35)}
.folder .art{display:grid;place-items:center;height:132px;border-radius:12px;background:radial-gradient(60% 70% at 50% 60%,color-mix(in srgb,var(--hue) 30%,transparent),transparent 70%)}
.folder .art svg{width:150px;height:120px;filter:drop-shadow(0 12px 22px rgba(0,0,0,.45))}
.folder .top{display:flex;align-items:center;gap:12px}
.folder b{font-size:14px;font-weight:600;letter-spacing:-.01em;display:block}
.folder .m{font-size:12px;color:var(--ink-3);display:block;margin-top:2px}
.folder .foot{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-3)}
.folder .foot .r{margin-left:auto}
.files{border:1px solid var(--line);border-radius:16px;overflow:auto;background:var(--glass);box-shadow:var(--inset);backdrop-filter:blur(22px) saturate(150%)}
.files table{width:100%;min-width:340px;border-collapse:collapse;font-size:13px}
.files th{text-align:left;font-size:11.5px;font-weight:500;color:var(--ink-3);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.files td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.files tr:last-child td{border-bottom:0}
.files tr.rowbtn{cursor:pointer;transition:background .12s}
.files tr.rowbtn:hover td{background:var(--hover)}
.files .nm{display:flex;align-items:center;gap:10px;min-width:0;font-weight:500}
.files .nm .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.files .who{display:flex;align-items:center;gap:8px;color:var(--ink-2);white-space:nowrap}
.files .who .av,.files .who .avi{width:22px;height:22px;font-size:10px}
.files td.r{text-align:right;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.quick button{display:grid;gap:8px;justify-items:start;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);min-width:0;transition:transform .15s,border-color .15s}
.quick button:hover{border-color:var(--line-2);transform:translateY(-1px)}
.quick button b{font-size:13.5px;font-weight:600}
.quick button span{font-size:12px;color:var(--ink-2)}
.ex-tag{font-size:10.5px;font-weight:500;color:var(--ink-3);background:var(--glass-2);border:1px solid var(--line);padding:2px 6px;border-radius:5px;letter-spacing:.02em}

/* ---------- Board ---------- */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(224px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start;overscroll-behavior-x:contain}
.col{background:var(--glass-flat);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:7px;min-height:140px;transition:background-color .15s}
.col.over{background:color-mix(in srgb,var(--stage) 14%,var(--panel));outline:2px dashed var(--stage);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:8px;padding:5px 6px 3px;font-weight:600;font-size:13px}
.col-h .sw{width:8px;height:8px;border-radius:50%;background:var(--stage);flex:none}
.col-h .n{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.kcard{background:var(--glass);box-shadow:var(--inset);border:1px solid var(--line);border-radius:12px;padding:10px 11px;display:grid;gap:6px;cursor:pointer;min-width:0;text-align:left;width:100%;transition:border-color .12s,transform .12s}
.kcard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.kcard.dragging{opacity:.35}
.kcard .top{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3);min-width:0}
.kcard .type{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kcard .title{font-weight:500;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.kcard .foot{display:flex;align-items:center;gap:6px 10px;font-size:11.5px;line-height:1.3;color:var(--ink-3);flex-wrap:wrap}
.late{color:var(--warn)}
.col-empty{font-size:12px;color:var(--ink-3);padding:14px 6px;border:1px dashed var(--line-2);border-radius:8px;text-align:center}

/* ---------- Calendar ---------- */
.cal-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cal-nav h2{margin:0 6px;min-width:9ch}
.cal{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}
.cal-dow{background:var(--panel-2);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);padding:8px}
.cal-day{background:var(--panel);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-day.out{background:var(--bg)}
.cal-day.out .cal-num{opacity:.5}
.cal-num{font-size:12px;line-height:1.6;color:var(--ink-3);align-self:flex-start;padding:0 5px;border-radius:5px;font-variant-numeric:tabular-nums}
.cal-day.today .cal-num{background:var(--accent);color:#fff;font-weight:600}
.ev{display:flex;gap:6px;align-items:flex-start;text-align:left;border:0;background:var(--glass-2);border-radius:6px;padding:4px 6px;font-size:12px;line-height:1.25;width:100%;min-width:0;transition:background .12s}
.ev:hover{background:var(--hover)}
.ev .sw{width:6px;height:6px;border-radius:50%;background:var(--stage);flex:none;margin-top:5px}
.ev .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0;overflow-wrap:anywhere}
.ev.done{opacity:.55}
.agenda{display:none;gap:14px}
.ag-day{display:grid;gap:6px}
.ag-day h3{font-size:12px;color:var(--ink-3);font-weight:500}
.ag-day.today h3{color:var(--accent-text)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wday{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:88px;display:grid;gap:4px;align-content:start;min-width:0}
.wday .d{font-size:11px;color:var(--ink-3);font-weight:500}
.wday.today .d{color:var(--accent-text)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .ev{width:auto;max-width:100%}

/* ---------- Tasks ---------- */
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass);min-width:0}
.task input[type="checkbox"]{width:17px;height:17px;margin-top:1px;accent-color:var(--accent);flex:none}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13.5px}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}
.task .m{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.task .m.late{color:var(--warn)}
.task .x{opacity:0;border:0;background:none;color:var(--ink-3);padding:0 2px}
.task:hover .x,.task .x:focus-visible{opacity:1}

/* ---------- Drawer / modal / toast / tooltip ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.dr-h{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 12px 20px}
.dr-h .kind{font-size:12px;font-weight:600;color:var(--ink-3);margin-right:auto}
.dr-b{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:18px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px}
.dr-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
.dr-actions .grow{margin-right:auto}
.title-in{font-size:21px!important;font-weight:600!important;letter-spacing:-.02em;border:0!important;background:none!important;padding:2px 0!important;border-radius:0!important;box-shadow:none!important}
.title-in:focus{outline:none!important;box-shadow:0 2px 0 var(--accent)!important}
.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:color-mix(in srgb,var(--panel) 90%,transparent);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);border:1px solid var(--line-2);box-shadow:var(--inset),var(--shadow);border-radius:18px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:var(--shadow);display:grid;gap:14px;padding:20px}
.modal.wide{width:min(780px,100%)}
.modal-h{display:flex;align-items:center;gap:10px}
.modal-h h2{margin-right:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:popIn .2s both}
.tip{position:fixed;z-index:70;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.4;pointer-events:none;max-width:260px;box-shadow:var(--shadow-s)}
.tip b{font-weight:600}
.err{font-size:12.5px;color:var(--bad)}
.meta{font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;z-index:45;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:4px;box-shadow:var(--shadow)}
.sheet button{display:flex;align-items:center;gap:12px;padding:12px 10px;border:0;background:none;border-radius:10px;text-align:left;font-size:14px;font-weight:500;width:100%}
.sheet button:hover{background:var(--hover)}
.sheet button svg{color:var(--ink-3)}
.menu{position:absolute;z-index:45;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line-2);border-radius:14px;padding:6px;display:grid;gap:2px;min-width:220px;box-shadow:var(--shadow);animation:popIn .18s both}
.menu button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;text-align:left;font-size:13px;width:100%}
.menu button:hover{background:var(--hover)}
.menu button svg{color:var(--ink-3);width:16px;height:16px}
.menu .sep{height:1px;background:var(--line);margin:4px 0}

/* ---------- Chat ---------- */
.chat{display:flex;flex-direction:column;min-height:0;gap:10px;flex:1}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--glass-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--ink-3);font-size:12px;text-align:center}
.msg .tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-height:40px;max-height:140px;resize:none;border:1px solid var(--line-2);background:var(--sunk);border-radius:10px;padding:9px 11px;line-height:1.4;min-width:0}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest button{border:1px solid var(--line-2);background:var(--glass-2);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--ink-2);transition:all .12s}
.suggest button:hover{border-color:var(--ink-3);color:var(--ink)}
.assist{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(30px) saturate(140%);-webkit-backdrop-filter:blur(30px) saturate(140%);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.assist .dr-b{gap:10px}

/* ---------- Wizard (onboarding) ---------- */
.wizard{display:grid;grid-template-columns:240px minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--glass);max-width:1040px;backdrop-filter:blur(26px) saturate(150%);box-shadow:var(--inset),0 24px 60px rgba(0,0,0,.4)}
.wz-side{padding:24px 20px;border-right:1px solid var(--line);background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:22px}
.wz-side .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em}
.wz-steps{display:grid;gap:4px}
.wz-step{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;font-size:13px;color:var(--ink-3)}
.wz-step .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.wz-step.on{color:var(--ink);background:var(--glass-2)}
.wz-step.on .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wz-step.done{color:var(--ink-2)}
.wz-step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.wz-step.done .n svg{width:12px;height:12px}
.wz-side .fine{margin-top:auto;font-size:11.5px;color:var(--ink-3);line-height:1.5}
.wz-body{padding:28px 32px;display:flex;flex-direction:column;gap:18px;min-width:0}
.wz-body h1{font-size:24px}
.wz-body .lede{margin-top:4px}
.wz-foot{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.wz-foot .grow{flex:1}
.style-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.style-card{display:grid;gap:8px;text-align:left;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--inset);transition:border-color .15s,transform .15s;min-width:0}
.style-card:hover{border-color:var(--line-2);transform:translateY(-1px)}
.style-card[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.style-card canvas{width:100%;aspect-ratio:9/16;border-radius:8px;display:block;background:#000}
.style-card b{font-size:13px;font-weight:600;display:block}
.style-card span{font-size:11.5px;color:var(--ink-3);display:block;line-height:1.35}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feat div{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.feat b{font-size:13px;font-weight:600;display:block}
.feat span{font-size:12px;color:var(--ink-2);display:block}

/* ---------- Editor ---------- */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.ed-side{display:flex;flex-direction:column;gap:12px;min-width:0;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px - env(safe-area-inset-top,0px))}
.ed-side .card{display:flex;flex-direction:column;min-height:0;flex:1}
.ed-side .tabs{flex:none}
.ed-side .pane{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto;flex:1;padding-top:12px}
.ed-main{display:grid;gap:12px;min-width:0}
.stage{background:var(--sunk);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;place-items:center;position:relative;min-height:320px;box-shadow:var(--inset)}
.stage canvas{max-width:100%;max-height:64vh;border-radius:10px;background:#000;display:block;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.stage .drop{display:grid;gap:12px;justify-items:center;text-align:center;padding:34px 20px;max-width:440px}
.stage .drop svg{width:34px;height:34px;color:var(--ink-3)}
.stage.over{outline:2px dashed var(--accent);outline-offset:-6px}
.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tc{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:11ch}
.tl{position:relative;height:78px;background:var(--glass);border-radius:10px;border:1px solid var(--line);overflow:hidden;cursor:pointer;user-select:none;touch-action:none}
.tl-keep{position:absolute;top:22px;bottom:16px;background:color-mix(in srgb,var(--accent) 45%,var(--panel));border-radius:4px}
.tl-cut{position:absolute;top:22px;bottom:16px;background:repeating-linear-gradient(135deg,transparent 0 4px,var(--line-2) 4px 6px);border-radius:4px}
.tl-cap{position:absolute;bottom:3px;height:3px;background:var(--ink-2);border-radius:2px}
.tl-hook{position:absolute;top:16px;height:3px;background:var(--ok);border-radius:2px}
.tl-head{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);box-shadow:0 0 0 1px var(--bg)}
.tl-head::after{content:"";position:absolute;top:-1px;left:-5px;border:6px solid transparent;border-top:7px solid var(--ink)}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.segs .chip.cutc{opacity:.6;text-decoration:line-through}
.segs .chip button{border:0;background:none;padding:0;color:var(--ink-3);display:grid;place-items:center}
.segs .chip button svg{width:12px;height:12px}
.caps{display:grid;gap:6px;max-height:320px;overflow:auto}
.caprow{display:grid;grid-template-columns:8ch minmax(0,1fr) auto;gap:6px;align-items:center}
.caprow input{border:1px solid var(--line-2);background:var(--sunk);border-radius:7px;padding:5px 8px;min-width:0;font-size:12.5px}
.caprow .tcin{font-variant-numeric:tabular-nums}
.proj{display:grid;gap:8px;text-align:left;border:1px solid var(--line);background:var(--glass);box-shadow:var(--inset);border-radius:16px;padding:10px;min-width:0;transition:transform .15s,border-color .15s}
.proj:hover{border-color:var(--line-2);transform:translateY(-1px)}
.proj .poster{aspect-ratio:9/16;max-height:200px;width:100%;object-fit:cover;border-radius:9px;background:var(--sunk);display:grid;place-items:center;color:var(--ink-3)}
.proj .poster svg{width:26px;height:26px}
.proj b{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.proj .m{font-size:11.5px;color:var(--ink-3)}
.ed-steps{display:grid;gap:6px}
.ed-step{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.ed-step .led{width:7px;height:7px;border-radius:50%;background:var(--line-2);flex:none}
.ed-step.on .led{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.ed-step.ok .led{background:var(--ok)}
.ed-step.bad .led{background:var(--bad)}
.range{display:grid;gap:4px}
.range input{width:100%;accent-color:var(--accent)}
.range .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:500;color:var(--ink-2)}
.progress{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

/* ---------- Stories ---------- */
.st{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.st-brief{display:grid;gap:12px}
.st-work{display:grid;gap:12px;min-width:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.fr-th{flex:none;width:72px;aspect-ratio:9/16;border-radius:8px;border:2px solid transparent;background:var(--sunk);overflow:hidden;padding:0;display:grid;place-items:center;position:relative;transition:border-color .15s}
.fr-th canvas{width:100%;height:100%;display:block}
.fr-th[aria-pressed="true"]{border-color:var(--ink)}
.fr-th .k{position:absolute;left:4px;top:4px;font-size:9px;font-weight:600;background:rgba(0,0,0,.55);color:#fff;padding:2px 4px;border-radius:3px;letter-spacing:.04em;text-transform:uppercase}
.fr-th.add{border:1px dashed var(--line-2);color:var(--ink-3)}
.st-stage{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.st-stage canvas{width:100%;max-width:320px;aspect-ratio:9/16;border-radius:16px;display:block;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.5);justify-self:center}
.fr-edit{display:grid;gap:10px}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:8px;border:2px solid transparent;background:var(--c)}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.seqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.seqs .proj .poster{max-height:160px}

/* ---------- Hooks / scripts ---------- */
.hook{display:grid;gap:8px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--glass);box-shadow:var(--inset)}
.hook .line{font-size:15.5px;line-height:1.35;font-weight:600;letter-spacing:-.01em;text-wrap:pretty;overflow-wrap:anywhere}
.hook .os{font-size:12.5px;color:var(--accent-text);overflow-wrap:anywhere;font-weight:500}
.hook .why{font-size:12.5px;color:var(--ink-2)}
.hook .foot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hook .score{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.beats{display:grid;gap:8px}
.beat{display:grid;grid-template-columns:5ch minmax(0,1fr);gap:10px;align-items:start}
.beat .at{font-size:12px;color:var(--ink-3);padding-top:2px;font-variant-numeric:tabular-nums}
.beat .line{font-size:13.5px}
.beat .os{font-size:11.5px;color:var(--accent-text);margin-top:2px;overflow-wrap:anywhere;font-weight:500}
.beat .br{font-size:12px;color:var(--ink-3);margin-top:2px}
.fw{display:grid;gap:6px;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:var(--glass);box-shadow:var(--inset);text-align:left;min-width:0}
.fw b{font-size:14px;font-weight:600}
.fw .s{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.fw p{font-size:12.5px;color:var(--ink-2)}
.fw[aria-pressed="true"]{border-color:var(--ink)}

/* ---------- Tables / charts ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--glass);box-shadow:var(--inset)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
.tbl th{text-align:left;font-size:11.5px;font-weight:500;color:var(--ink-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.rk{color:var(--ink-3);width:3ch;font-variant-numeric:tabular-nums}
.tbl tr.rowbtn{cursor:pointer}
.tbl tr.rowbtn:hover td{background:var(--hover)}
.viz{display:grid;gap:8px;min-width:0}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz .bar{fill:var(--series-1)}
.viz .grid{stroke:var(--grid);stroke-width:1}
.viz .axis{fill:var(--ink-3);font-size:11px;font-family:var(--f)}
.viz .lab{fill:var(--ink-2);font-size:11px;font-weight:500;font-family:var(--f)}
.viz .hit{fill:transparent}
.viz g:hover .bar{opacity:.8}
.viz-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.viz-foot .t{font-size:12px;color:var(--ink-3)}
.spark{width:100%;height:44px;display:block;overflow:visible}
.spark path.l{fill:none;stroke:var(--series-1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark path.a{fill:url(#sparkFill);stroke:none}
.spark circle{fill:var(--series-1);stroke:var(--panel);stroke-width:2}

/* ---------- Academy ---------- */
.course{display:grid;gap:10px;text-align:left;border:1px solid var(--line);background:var(--glass);box-shadow:var(--inset);border-radius:16px;padding:14px;min-width:0;transition:transform .15s,border-color .15s}
.course:hover{border-color:var(--line-2);transform:translateY(-1px)}
.course .cover{height:92px;border-radius:12px;--hue:var(--h-academy);background:linear-gradient(145deg,color-mix(in srgb,var(--hue) 60%,transparent),color-mix(in srgb,var(--hue) 18%,transparent));display:flex;align-items:flex-end;padding:10px;font-size:22px;font-weight:700;color:#fff;letter-spacing:-.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.12)}
.course b{font-size:15px;font-weight:600}
.course p{font-size:12.5px;color:var(--ink-2)}
.course .m{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.lessons{display:grid;gap:4px}
.lesson{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:1px solid transparent;background:none;text-align:left;width:100%;min-width:0;transition:background .12s}
.lesson:hover{background:var(--hover)}
.lesson[aria-current="true"]{background:var(--glass-2);border-color:var(--line)}
.lesson .n{font-size:11px;color:var(--ink-3);width:2.5ch;font-variant-numeric:tabular-nums}
.lesson .t{flex:1;min-width:0;overflow-wrap:anywhere;font-size:13.5px}
.lesson .d{font-size:11px;color:var(--ink-3);white-space:nowrap}
.lesson .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.lesson .ck svg{width:11px;height:11px;color:#fff}
.lesson.done .ck{background:var(--ok);border-color:var(--ok)}
.player{background:var(--sunk);border:1px solid var(--line);border-radius:14px;aspect-ratio:16/9;max-height:380px;width:100%;display:grid;place-items:center;text-align:center;padding:20px}
.player .in{display:grid;gap:10px;justify-items:center;max-width:380px}
.player svg{width:40px;height:40px;color:var(--ink-3)}
.lesson-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);transition:width .3s}

/* ---------- Responsive ---------- */
@media (max-width: 1120px){ .ed{grid-template-columns:minmax(0,1fr)} .ed-side{position:static;max-height:none} .lesson-grid{grid-template-columns:minmax(0,1fr)} .st{grid-template-columns:minmax(0,1fr)} .wizard{grid-template-columns:minmax(0,1fr)} .wz-side{border-right:0;border-bottom:1px solid var(--line);padding:16px 20px} .wz-side .fine{display:none} .wz-steps{display:flex;flex-wrap:wrap;gap:4px} }
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .topbar .ws{padding:0;margin-right:auto;width:auto}
  .topbar .ws:hover{background:none;border-color:transparent}
  .main{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(88px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:14px}
  .crumbs .ctl.search{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:6px 2px;color:var(--ink-3);font-size:10.5px;font-weight:500;border-radius:8px}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  h1,.h1{font-size:23px}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .row3,.row4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal{display:none} .agenda{display:grid}
  .week{grid-template-columns:repeat(2,minmax(0,1fr))}
  .feat{grid-template-columns:minmax(0,1fr)}
  .stage{min-height:240px}
  .stage canvas{max-height:56vh}
  .ed-side{max-height:none}
  .caprow{grid-template-columns:7ch minmax(0,1fr) auto}
  .st-stage{grid-template-columns:minmax(0,1fr)}
  .wz-body{padding:20px 16px}
  .files .nm .t{max-width:22ch}
  .files th:nth-child(3),.files td:nth-child(3),.files th:nth-child(4),.files td:nth-child(4){display:none}
}
@media (max-width: 420px){ .row2{grid-template-columns:minmax(0,1fr)} .row3,.row4{grid-template-columns:minmax(0,1fr)} }

/* ---- v4: flat navigation, connections, autopilot queue ---- */
.tree-g + .tree-g{margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.connects .connect{display:flex;gap:12px;align-items:center}
.connect.on{border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.connect .spin{width:18px;height:18px;flex:none}
.steps-log{display:grid;gap:8px}
.steps-log .srow{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.steps-log .srow .dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex:none}
.steps-log .srow.on{color:var(--ink)}
.steps-log .srow.on .dot{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent);animation:pulse 1.2s ease-in-out infinite}
.steps-log .srow.done .dot{background:var(--ok)}
.steps-log .srow.err .dot{background:var(--bad)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.ap-switch{width:44px;height:26px;border-radius:13px;border:1px solid var(--line-2);background:var(--sunk);position:relative;cursor:pointer;flex:none;transition:background .2s,border-color .2s}
.ap-switch i{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .2s}
.ap-switch[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.ap-switch[aria-checked="true"] i{transform:translateX(18px)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.slot{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--glass);box-shadow:var(--inset);position:relative}
.slot.empty{border-style:dashed;background:var(--glass-flat)}
.slot-d{display:grid;min-width:58px}
.slot-d b{font-size:13px;font-weight:600}
.slot-d span{font-size:11.5px;color:var(--ink-3)}
.slot-img{width:44px;border-radius:8px;object-fit:cover;background:#000;display:block}
.slot-b{min-width:0}
.slot-b b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .toolbar{grid-column:1/-1;flex-wrap:wrap;gap:6px}
.set{scroll-margin-top:84px}
.st-stage canvas{max-width:360px}
@media (max-width:860px){.slot{grid-template-columns:auto minmax(0,1fr)}.slot-img,.slot > .tile{display:none}}

.ap-head{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.ap-card > .card-h{flex-wrap:wrap}
@media (max-width:860px){.ap-head{flex:1 1 100%}.ap-card > .card-h > .btn{width:100%;justify-content:center}}

.start-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.start-step{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--glass-flat);color:var(--ink);cursor:pointer;font:inherit}
.start-step:hover{border-color:var(--line-2);background:var(--hover)}
.start-step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--sunk);flex:none}
.start-step .n svg{width:13px;height:13px}
.start-step.done .n{background:var(--ok-soft);color:var(--ok)}
.start-step.done b{text-decoration:line-through;color:var(--ink-3)}
.start-step .b{flex:1;min-width:0;display:grid;gap:1px}
.start-step .b b{font-size:13px;font-weight:600}
.start-step .b span{font-size:11.5px;color:var(--ink-3)}
.start-step > svg:last-child{color:var(--ink-3);flex:none;width:14px;height:14px}

button.style-card{font:inherit;color:var(--ink);cursor:pointer;width:100%}
button.style-card:disabled{cursor:default;opacity:.7}

.proj.final{cursor:default}
.proj.final .toolbar{margin-top:6px;gap:6px;flex-wrap:wrap}

.chips-wrap{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chips-wrap .chip{white-space:normal;height:auto;line-height:1.35;padding:6px 10px;max-width:100%;overflow-wrap:anywhere}

.player{position:relative;overflow:hidden}
.player.ph{padding:0;cursor:pointer;border-color:var(--line-2)}
.player.ph .poster-bg{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 42%,color-mix(in srgb,var(--h-academy) 26%,transparent),transparent 72%),linear-gradient(180deg,#202127,#0B0B0E)}
.player.ph .pin{position:relative;display:grid;gap:10px;justify-items:center}
.player .playbtn{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;box-shadow:0 12px 32px rgba(0,0,0,.45);transition:transform .15s}
.player.ph:hover .playbtn{transform:scale(1.06)}
.player .playbtn svg{width:26px;height:26px;color:#111;margin-left:3px}
.player .cap{position:absolute;left:14px;bottom:12px;display:flex;gap:10px;align-items:center;font-size:12.5px;color:#fff;text-align:left}
.player .cap b{font-weight:600}
.player .cap .muted{color:rgba(255,255,255,.7)}
.player .tag{position:absolute;right:12px;top:12px}
.player.live{padding:0;display:block;background:#000;max-height:none}
.player.live iframe,.player.live video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.player.live .fallback{position:absolute;right:10px;bottom:8px;color:rgba(255,255,255,.75);background:rgba(0,0,0,.5);padding:3px 8px;border-radius:999px;font-size:11.5px}
.player.big{max-height:none}
.vsl{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--glass);box-shadow:var(--inset)}
.vsl-t h2{font-size:22px;letter-spacing:-.02em;margin:4px 0 8px}
@media (max-width:860px){.vsl{grid-template-columns:minmax(0,1fr)}}

.player.ph .poster-bg{background:#000}
.player.ph .poster-bg .poster-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.player.ph .poster-bg .poster-svg{animation:none}}
.player.ph .cap{bottom:30px}
.player.ph .tag{top:10px;right:10px;background:rgba(0,0,0,.55);color:#fff;border-color:rgba(255,255,255,.2)}
.lesson .thumb{width:64px;height:36px;border-radius:6px;overflow:hidden;flex:none;background:#000;display:block}
.lesson .thumb svg{width:100%;height:100%;display:block}
.course .cover{position:relative;overflow:hidden;padding:0;display:block;height:120px;background:linear-gradient(135deg,color-mix(in srgb,var(--hue) 55%,#0b0b0e),#0b0b0e 85%)}
.course .cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.course .cover .num{position:absolute;left:12px;top:10px;font:600 11px var(--f-display);letter-spacing:.08em;color:rgba(255,255,255,.75)}
.course .cover .big{position:absolute;left:12px;bottom:28px;font:700 20px/1.1 var(--f-display);letter-spacing:-.02em;color:#fff;right:12px}
.course .cover .ct{position:absolute;left:12px;bottom:10px;font-size:11px;color:rgba(255,255,255,.7)}

.lessons.compact .thumb{display:none}


/* ---- v6: notes on the timeline, graphics and camera lanes, custom styles, style builder, onboarding ---- */
:root{--note:#FFD60A;--note-soft:rgba(255,214,10,.16)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--note:#8A6400;--note-soft:rgba(180,130,0,.14)}}
:root[data-theme="light"]{--note:#8A6400;--note-soft:rgba(180,130,0,.14)}
.tl-fx{position:absolute;height:3px;border-radius:2px;pointer-events:none}
.tl-fx.big{top:16px;background:var(--ink)}
.tl-fx.tag{top:16px;background:var(--h-ai)}
.tl-fx.zoom{bottom:9px;background:var(--warn)}
.tl-cm{position:absolute;top:3px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--note);box-shadow:0 0 0 2px var(--bg);pointer-events:none}
.tl-cm::after{content:"";position:absolute;left:4px;top:10px;width:2px;height:62px;background:color-mix(in srgb,var(--note) 55%,transparent)}
.tl-cm.done{background:var(--ok)} .tl-cm.done::after{background:color-mix(in srgb,var(--ok) 40%,transparent)}
.tl-cm.failed{background:var(--bad)} .tl-cm.failed::after{background:color-mix(in srgb,var(--bad) 40%,transparent)}
.tl-cm.working{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-3)}
.tl-legend .k{display:inline-flex;align-items:center;gap:6px}
.tl-legend .k::before{content:"";width:12px;height:4px;border-radius:2px;background:var(--ink-3)}
.tl-legend .keep::before{background:color-mix(in srgb,var(--accent) 45%,var(--panel));height:8px}
.tl-legend .cut::before{background:repeating-linear-gradient(135deg,transparent 0 2px,var(--line-2) 2px 4px);height:8px;outline:1px solid var(--line)}
.tl-legend .fx::before{background:var(--ink)}
.tl-legend .nt::before{background:var(--note);width:8px;height:8px;border-radius:50%}
button.chip{font:inherit;font-size:11.5px;font-weight:500;cursor:pointer}
button.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip > svg{width:12px;height:12px;flex:none}

.cm-compose{display:grid;gap:8px}
.pin{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--glass-2);color:var(--ink-2);font-variant-numeric:tabular-nums;cursor:pointer}
.pin[aria-pressed="true"]{background:var(--note-soft);color:var(--note);border-color:color-mix(in srgb,var(--note) 45%,transparent)}
.pin svg{width:13px;height:13px}
.cm-list{display:grid;gap:8px}
.cm{border:1px solid var(--line);background:var(--glass-flat);border-radius:12px;padding:9px 10px;display:grid;gap:6px;min-width:0}
.cm.working{border-color:var(--accent)}
.cm.failed{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.cm-h{display:flex;align-items:center;gap:8px;min-width:0}
.cm-h .t{font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;border:0;background:var(--note-soft);color:var(--note);cursor:pointer;white-space:nowrap}
.cm-h .st{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.cm.done .st{color:var(--ok)} .cm.failed .st{color:var(--bad)} .cm.working .st{color:var(--accent-text)}
.cm-h .x{border:0;background:none;color:var(--ink-3);padding:3px;display:grid;place-items:center;border-radius:6px;cursor:pointer}
.cm-h .x:hover{color:var(--ink);background:var(--hover)}
.cm-h .x svg{width:13px;height:13px}
.cm-t{font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.cm-r{font-size:12.5px;line-height:1.5;color:var(--ink-2);white-space:pre-wrap;overflow-wrap:anywhere;border-left:2px solid var(--line-2);padding-left:8px}
.cm .tools{display:flex;flex-wrap:wrap;gap:4px}
.fxrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.fxrow .t{border:0;background:var(--glass-2);border-radius:6px;padding:3px 7px;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-2);cursor:pointer}
.fxrow .k{color:var(--ink-3);font-size:11.5px;white-space:nowrap}
.fxrow .x{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.style-grid.mine{grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),190px))}
.style-card.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.style-card .cv{border:0;background:none;padding:0;display:block;width:100%;cursor:pointer;border-radius:8px}
.style-card .toolbar{gap:6px}
.style-card.add{align-content:center;justify-items:start;gap:12px;min-height:200px;border-style:dashed;border-color:var(--line-2);background:none;padding:16px;box-shadow:none}
.style-card.add:hover{border-color:var(--ink-3);background:var(--glass-flat)}
.style-card.add .plus{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--line);color:var(--ink)}
.style-card.add .plus svg{width:18px;height:18px}
.style-card.add b{font-size:14px}

.sb-top{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:12px;align-items:start}
.sb-stage{min-height:0;padding:12px}
.sb-stage canvas{max-height:54vh}
.sb-drop{display:grid;gap:6px;justify-items:center;text-align:center;padding:18px 14px;border:1px dashed var(--line-2);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.sb-drop:hover,.sb-drop.over{border-color:var(--accent);background:var(--accent-soft)}
.sb-drop svg{width:24px;height:24px;color:var(--ink-3)}
.sb-drop b{font-weight:600;font-size:14px}
.refs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.refs:empty{display:none}
.refs img{width:42px;height:74px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
#sb-controls{overflow:auto;gap:12px}
#sb-controls input[type="color"]{width:26px;height:26px;padding:0;border:1px solid var(--line-2);border-radius:50%;background:none;cursor:pointer}
@media (max-width:700px){.sb-top{grid-template-columns:minmax(0,1fr)} .sb-stage canvas{max-height:42vh}}

.wz-connect{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wz-connect.ok{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.wz-connect .grow{flex:1}
.wz-scan{display:grid;gap:10px}
.wz-scan textarea{min-height:56px}

/* editor workspace: the video, the transport and the timeline fit on one screen */
.ed-head{align-items:center}
.ed-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 320px}
.ed-title .title-in{flex:1 1 160px;min-width:110px;max-width:440px;width:auto;font-size:18px!important}
.ed-main > .stage{min-height:0;padding:10px}
.ed-main > .stage canvas{max-height:max(260px,calc(100vh - 380px))}
.btn.note{background:var(--note-soft);color:var(--note);border-color:color-mix(in srgb,var(--note) 40%,transparent)}
.btn.note:hover{background:color-mix(in srgb,var(--note) 24%,transparent)}
.ed-steps[hidden]{display:none}
@media (max-width:860px){.ed-main > .stage canvas{max-height:52vh} .ed-title{flex-basis:100%}}

.lnk{color:var(--accent-text);background:none;border:0;padding:0;font:inherit;font-weight:500;cursor:pointer}
.lnk:hover{text-decoration:underline}
.ed-title .title-in{flex:0 1 auto;width:auto;max-width:100%}
.tl-strip{position:absolute;left:0;right:0;top:22px;bottom:16px;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none}
.tl.has-strip .tl-keep{background:none;box-shadow:inset 0 0 0 1.5px var(--accent);border-radius:3px}
.tl.has-strip .tl-cut{background:repeating-linear-gradient(135deg,rgba(0,0,0,.8) 0 4px,rgba(0,0,0,.6) 4px 7px);border-radius:0}
#sb-controls input[type="color"]{overflow:hidden;-webkit-appearance:none;appearance:none}
#sb-controls input[type="color"]::-webkit-color-swatch-wrapper{padding:0}
#sb-controls input[type="color"]::-webkit-color-swatch{border:0;border-radius:50%}
#sb-controls input[type="color"]::-moz-color-swatch{border:0;border-radius:50%}
.wz-scan .f textarea{min-height:60px}

.tl-wave{position:absolute;left:0;right:0;bottom:16px;height:13px;background-size:100% 100%;background-repeat:no-repeat;opacity:.75;pointer-events:none}
.words-card{display:grid;gap:8px;padding:11px 12px;border:1px solid color-mix(in srgb,var(--note) 40%,var(--line));background:var(--note-soft);border-radius:12px}
.words-card b{font-size:13.5px;font-weight:600}
.words-card .meta{color:var(--ink-2)}
.words-card textarea{border:1px solid var(--line-2);background:var(--sunk);border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.45;min-height:64px;resize:vertical;width:100%}
.words-card select{width:100%}

.words-slot:empty{display:none}

/* ---- website build: connect panel, style builder without a settings panel ---- */
.cn{display:grid;gap:10px;min-width:0}
.cn .f input{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em}
.cn .err{font-size:12.5px;color:var(--bad);margin:0}
.sb{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
.sb .sb-stage{position:sticky;top:16px}
.sb-summary{font-size:13px;line-height:1.5;color:var(--ink-2);border-left:2px solid var(--line-2);padding-left:10px;margin:0}
.sb-summary[hidden]{display:none}
.sb textarea#sb-note{border:1px solid var(--line-2);background:var(--sunk);border-radius:9px;padding:8px 10px;font-size:13px;line-height:1.45;min-height:56px;resize:vertical;width:100%}
@media (max-width:860px){.sb{grid-template-columns:minmax(0,1fr)} .sb .sb-stage{position:static}}

/* ===================== v3: Claude Code hand-off ===================== */
/* Brand */
.ws.brand{cursor:pointer}
.ws.brand .mark,.brand .mark{width:32px;height:32px;flex:none;border-radius:9px;box-shadow:0 4px 14px rgba(47,107,242,.35);display:block}
.ws.brand .nm b{font-size:15px;font-weight:700;letter-spacing:-.02em}
/* Connect steps */
.cn-steps{margin:0;padding-left:20px;display:grid;gap:12px;font-size:13.5px;line-height:1.5;color:var(--ink-2);min-width:0}
.cn-steps li{min-width:0}
.cn-steps li::marker{color:var(--ink-3);font-weight:600}
.cn-steps b{color:var(--ink);font-weight:600}
.cn-steps a{color:var(--accent-text)}
.cn-steps li.alt{list-style:none;margin-left:-20px}
.cn-steps details summary{cursor:pointer;color:var(--ink-3);font-size:12.5px}
.cn-steps details[open] summary{margin-bottom:8px}
.copybox{display:grid;gap:6px;margin-top:8px;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:var(--sunk);min-width:0}
.copybox-h{display:flex;align-items:center;gap:8px;justify-content:space-between}
.copybox .lbl{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.copybox code{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);overflow-wrap:anywhere;word-break:break-all;user-select:all;display:block}
.copybox .help{font-size:11.5px;color:var(--ink-3)}
.pill .spin{width:10px;height:10px;border-width:1.5px}
/* The edit composer */
.ec{display:grid;gap:22px;padding:20px}
.ec-step{display:grid;gap:10px;min-width:0}
.ec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ec-h .n{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;flex:none;align-self:center}
.ec-h h3{font-size:15.5px;letter-spacing:-.01em}
.ec-drop{display:flex;gap:12px;align-items:center;padding:18px 16px;border:1px dashed var(--line-2);border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s;font-size:13.5px;line-height:1.45}
.ec-drop:hover,.ec-drop.over{border-color:var(--accent);background:var(--accent-soft)}
.ec-drop > svg{width:22px;height:22px;color:var(--ink-3);flex:none}
.ec-drop b{font-weight:600}
.ec-drop.has{padding:10px 14px}
.ec-files{display:flex;flex-wrap:wrap;gap:6px}
.ec-files .chip .x{border:0;background:none;padding:0;margin-left:2px;color:var(--ink-3);display:inline-grid;cursor:pointer}
.ec-files .chip .x svg{width:11px;height:11px}
.ec textarea#ec-brief{min-height:84px;font-size:14.5px}
.ec-run{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--line)}
.btn.lg{padding:12px 20px;font-size:15px;border-radius:13px}
.engines{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.engine{display:grid;gap:4px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);box-shadow:var(--inset);transition:border-color .15s,transform .15s;min-width:0}
.engine:hover{border-color:var(--line-2);transform:translateY(-1px)}
.engine b{font-size:14px;font-weight:600}
.engine span{font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.engine[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
/* Style gallery */
.style-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,148px),1fr))}
.style-grid.compact{grid-template-columns:repeat(auto-fill,minmax(min(100%,120px),1fr))}
.style-card{align-content:start;gap:6px;cursor:pointer}
.style-card span{font-size:inherit;color:inherit;line-height:inherit}
.style-card .sc-t{display:flex;align-items:center;gap:6px;min-width:0}
.style-card .sc-t b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.style-card .sc-t .pill{font-size:10px;padding:1px 6px;display:inline-flex;color:var(--ink-2)}
.style-card .sc-d{font-size:11.5px;color:var(--ink-3);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.style-card .sc-edit{margin-left:auto;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;color:var(--ink-3);flex:none}
.style-card .sc-edit:hover{background:var(--hover);color:var(--ink)}
.style-card .sc-edit svg{width:12px;height:12px}
.style-card.new{border-style:dashed;border-color:var(--line-2);background:none;box-shadow:none}
/* A moving picture of each look */
.sp{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:10px;overflow:hidden;container-type:inline-size;background:#0b0d12;isolation:isolate;font-family:Inter,system-ui,sans-serif;color:#fff;line-height:1.12;text-align:center}
.sp span,.sp b,.sp i{display:block;font-size:inherit;color:inherit;line-height:inherit;font-style:normal;font-weight:inherit}
.sp .sp-bg{position:absolute;inset:0;background:radial-gradient(120% 80% at 30% 8%,#44536e,#1a2030 58%,#0b0d12)}
.sp .sp-head{position:absolute;left:50%;top:26%;width:26%;aspect-ratio:1;border-radius:50%;margin-left:-13%;background:linear-gradient(180deg,#dcb693,#b78a66)}
.sp .sp-body{position:absolute;left:19%;top:43%;width:62%;height:70%;border-radius:40% 40% 0 0;background:linear-gradient(180deg,#2c3447,#151925)}
.sp .sp-cap{position:absolute;left:8%;right:8%;top:60%;font-weight:800;font-size:8.2cqw;letter-spacing:-.01em;text-shadow:0 .6cqw 2cqw rgba(0,0,0,.6)}
.sp .sp-cap b{display:inline}
.sp .caps{text-transform:uppercase;font-weight:900}
.sp .small{font-size:5.6cqw;top:72%}
.sp .low{top:76%}
.sp .tiny{font-size:4.6cqw;font-weight:500;top:85%}

function barChart({data, height, fmt, horizontal, note}){

  let svg;
  if (!horizontal){
    const W = 600, H = height || 200, padL = 42, padB = 26, padT = 10, padR = 8;
    const iw = W - padL - padR, ih = H - padT - padB;
    const slot = iw / data.length, bw = Math.min(24, slot * 0.6);
    svg = svgEl("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":"Bar chart"});

    data.forEach((d, i) => {
      const x = padL + slot * i + (slot - bw) / 2, bh = Math.max(0, ih * (d.value || 0) / top), y = padT + ih - bh;
      const g = svgEl("g");
      g.append(svgEl("rect", {class:"hit", x:padL + slot * i, y:padT, width:slot, height:ih}));
      g.append(svgEl("path", {class:"bar", d:roundTop(x, y, bw, bh, 4), style:`transform-origin:${x + bw / 2}px ${padT + ih}px`}));
      if (d.label) svg.append(svgEl("text", {class:"axis", x:padL + slot * i + slot / 2, y:H - 8, "text-anchor":"middle"}, trunc(d.label, Math.max(3, Math.floor(slot / 7)))));
      g.addEventListener("mousemove", e => showTip(e, () => [h("b", {text:d.label}), h("br"), fmt(d.value), d.hint ? h("div", {text:d.hint}) : ""]));
      g.addEventListener("mouseleave", hideTip);
      svg.append(g);
    });

    const W = 600, rowH = 26, padL = 150, padR = 56, H = data.length * rowH + 8;
    const iw = W - padL - padR;
    svg = svgEl("svg", {viewBox:`0 0 ${W} ${H}`, role:"img", "aria-label":"Bar chart"});
    data.forEach((d, i) => {
      const y = 4 + i * rowH, bw = Math.max(0, iw * (d.value || 0) / top), bh = 16;
      const g = svgEl("g");
      g.append(svgEl("rect", {class:"hit", x:0, y, width:W, height:rowH}));
      g.append(svgEl("text", {class:"lab", x:padL - 10, y:y + 12 + 4, "text-anchor":"end"}, trunc(d.label, 22)));
      g.append(svgEl("path", {class:"bar", d:roundRight(padL, y + 4, bw, bh, 4), style:`transform-origin:${padL}px ${y + 12}px`}));
      g.append(svgEl("text", {class:"axis", x:padL + bw + 6, y:y + 12 + 4}, fmt(d.value)));
      g.addEventListener("mousemove", e => showTip(e, () => [h("b", {text:d.label}), h("br"), fmt(d.value), d.hint ? h("div", {text:d.hint}) : ""]));
      g.addEventListener("mouseleave", hideTip);
      svg.append(g);
    });
  }
  wrap.append(svg);
  const tbl = h("div", {class:"tbl-wrap", hidden:true}, h("table", {class:"tbl", style:"min-width:0"}, h("thead", null, h("tr", null, h("th", {text:"Label"}), h("th", {class:"num", text:"Value"}))),
    h("tbody", null, data.map(d => h("tr", null, h("td", {text:d.label}), h("td", {class:"num", text:fmt(d.value)}))))));
  const tog = btn("Table", {class:"btn sm ghost", onclick:() => { tbl.hidden = !tbl.hidden; tog.textContent = tbl.hidden ? "Table" : "Chart"; }});
  wrap.append(h("div", {class:"viz-foot"}, h("span", {class:"t", text:note || ""}), tog), tbl);

}
function sparkline(values){
  const W = 200, H = 44, n = values.length;
  const svg = svgEl("svg", {class:"spark", viewBox:`0 0 ${W} ${H}`, preserveAspectRatio:"none", "aria-hidden":"true"});
  const defs = svgEl("defs"); const g = svgEl("linearGradient", {id:"sparkFill", x1:"0", y1:"0", x2:"0", y2:"1"});
  g.append(svgEl("stop", {offset:"0", "stop-color":"var(--series-1)", "stop-opacity":".35"}), svgEl("stop", {offset:"1", "stop-color":"var(--series-1)", "stop-opacity":"0"})); defs.append(g); svg.append(defs);
  if (n < 2) return svg;
  const max = Math.max(1, ...values), min = Math.min(0, ...values);
  const pts = values.map((v, i) => [i * W / (n - 1), H - 4 - (H - 10) * (v - min) / (max - min || 1)]);
  let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (let i = 1; i < n; i++){ const p0 = pts[i - 1], p1 = pts[i]; const cx = (p0[0] + p1[0]) / 2; d += ` C${cx.toFixed(1)} ${p0[1].toFixed(1)} ${cx.toFixed(1)} ${p1[1].toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`; }
  svg.append(svgEl("path", {class:"a", d:d + ` L${W} ${H} L0 ${H} Z`}), svgEl("path", {class:"l", d}));
  const last = pts[n - 1];
  svg.append(svgEl("circle", {cx:last[0], cy:last[1], r:3.5}));
  return svg;
}
function svgEl(tag, attrs, text){ const el = document.createElementNS("http://www.w3.org/2000/svg", tag); if (attrs) for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); if (text != null) el.textContent = text; return el; }
function roundTop(x, y, w, hgt, r){ r = Math.min(r, w / 2, hgt); if (hgt <= 0) return ""; return `M${x} ${y + hgt} V${y + r} Q${x} ${y} ${x + r} ${y} H${x + w - r} Q${x + w} ${y} ${x + w} ${y + r} V${y + hgt} Z`; }
function roundRight(x, y, w, hgt, r){ r = Math.min(r, hgt / 2, w); if (w <= 0) return ""; return `M${x} ${y} H${x + w - r} Q${x + w} ${y} ${x + w} ${y + r} V${y + hgt - r} Q${x + w} ${y + hgt} ${x + w - r} ${y + hgt} H${x} Z`; }
function niceTicks(max, n){ if (max <= 0) return [0, 1]; const raw = max / n; const mag = Math.pow(10, Math.floor(Math.log10(raw))); const norm = raw / mag; const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag; const out = []; for (let t = 0; t <= max + step * 0.999; t += step) out.push(Math.round(t * 1e6) / 1e6); return out; }
function trunc(s, n){ s = String(s || ""); return s.length > n ? s.slice(0, Math.max(1, n - 1)) + "…" : s; }

/* ---------- Zip (store only) for multi-file downloads ---------- */
const CRC_T = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++){ let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(); const parts = []; const central = []; let offset = 0;
  const le16 = n => [n & 255, (n >> 8) & 255], le32 = n => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  for (const f of files){
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const head = new Uint8Array([80,75,3,4, ...le16(20), ...le16(0), ...le16(0), ...le16(0), ...le16(0), ...le32(crc), ...le32(data.length), ...le32(data.length), ...le16(name.length), ...le16(0)]);
    parts.push(head, name, data);
    central.push(new Uint8Array([80,75,1,2, ...le16(20), ...le16(20), ...le16(0), ...le16(0), ...le16(0), ...le16(0), ...le32(crc), ...le32(data.length), ...le32(data.length), ...le16(name.length), ...le16(0), ...le16(0), ...le16(0), ...le16(0), ...le32(0), ...le32(offset)]), name);
    offset += head.length + name.length + data.length;
  }
  const cdStart = offset; let cdLen = 0; central.forEach(c => cdLen += c.length);
  const end = new Uint8Array([80,75,5,6, ...le16(0), ...le16(0), ...le16(files.length), ...le16(files.length), ...le32(cdLen), ...le32(cdStart), ...le16(0)]);
  return new Blob([...parts, ...central, end], {type:"application/zip"});
}
async function saveFile(filename, data){
  try {
    const blob = data instanceof Blob ? data : new Blob([data]); const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; a.style.display = "none"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); (window.__saved = window.__saved || []).push({filename, size:blob.size});
    toast("Saved " + filename); return true;
  } catch (e){ toast("Couldn’t save the file."); return false; }
}
