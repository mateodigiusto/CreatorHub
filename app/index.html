const ACADEMY_SEED = [{"id":"start-here","title":"Start here","subtitle":"Set up in 15 minutes","level":"Beginner","hue":0,"order":1,"description":"Connect your Claude account, make your first edit, connect Instagram and learn the two habits that make all of this work. Seven short lessons.","modules":[{"title":"Setup","lessons":[{"id":"sh-1","title":"Welcome: what CreatorHub does","duration":"3 min","status":"coming","video":"","resources":[],"notes":"CreatorHub runs one loop: plan a piece, script it, film it, edit it, post it, read the numbers, repeat. Each module is one step of that loop, and the AI behind every step runs on your own Claude account.\n\n## What you will set up in this course\n- Your Claude account (one click, one permission).\n- Your first auto-edit, from a raw clip to a finished video.\n- Instagram, so your numbers read themselves.\n- A competitor, so you learn what works in your niche without guessing.\n\n## The modules\n- Editor: drop a clip, get cuts, captions and the on-screen hook in your style, then talk to it until it is right.\n- Scripts: one topic in, a full script out, with three hook options.\n- Performance: your numbers as charts, read by the assistant.\n- Planner: what you are making this week and where each piece is.\n- Competitors: the patterns behind accounts one step ahead of you.\n\nNothing is resold. Your footage never leaves your device."},{"id":"sh-2","title":"Connect your Claude account","duration":"2 min","status":"coming","video":"","resources":[],"notes":"CreatorHub runs on your own Claude account. You do not buy credits here. The AI features count against your Claude plan the same way a chat message does.\n\n## What you need\n- A Claude account at claude.ai. Free, Pro and Max all work. Pro or Max gives you more room for long editing sessions.\n- CreatorHub open in the browser where you are signed in to claude.ai.\n\n## Steps\n1. Open CreatorHub from the link you were given. Not signed in to Claude? Sign in first, then open the link again.\n2. Finish the four setup screens: about you, your style, editing style, connect. Press \"Create my workspace\".\n3. On Home, in \"Getting started\", press \"Connect your Claude account\".\n4. A box appears: \"Allow CreatorHub to use Claude?\" Press Allow. This happens once.\n5. The light at the bottom of the sidebar turns green and reads \"AI connected\". The step ticks itself off.\n\n## If the light is not green\n- Orange, \"AI ready\": nothing is wrong. It turns green the first time a feature asks.\n- \"AI blocked\": you pressed Don't allow. Open the page's permissions menu in claude.ai (the icon next to the page title), allow Claude for CreatorHub, then press the step again.\n- \"Not available in this view\": the page is open outside claude.ai. Open it on claude.ai.\n\n## What gets sent, and what never does\n- Sent: your brand brain, the brief of the piece you are working on, a few still frames from a clip and the transcript you pasted, your performance numbers when you ask for a read.\n- Never sent: your video files. Footage stays in your browser and renders on your device."},{"id":"sh-4","title":"Your first edit","duration":"5 min","status":"coming","video":"","resources":[],"notes":"## Steps\n1. Sidebar, Editor. Drop a clip on the big box or press \"Choose a file\". MP4, MOV or WebM. A talking-head reel under three minutes is the best first test.\n2. Wait for the clip to open. The timeline shows one green segment: the whole clip.\n3. Press \"Auto-edit\" at the top right. The assistant samples frames, reads the transcript if you pasted one, and comes back with cuts, captions and a hook in your style. About a minute.\n4. Press play and watch it once without touching anything.\n5. Talk to it in the panel on the right: \"Tighter.\" \"Captions lower.\" \"Hook at the top.\" \"Cut the part where I repeat myself.\" Each message changes the edit.\n6. Captions tab: fix any word. Style tab: change the look for this project only.\n7. Export tab, \"Render and save video\". Keep the tab visible while it renders. The file lands in your downloads and under \"Final videos\" on the Editor page.\n\n## Good to know\n- Nothing uploads. On another device the footage is not there; the project notes are.\n- Big Caps is the default look. Change the default in Settings, Style."},{"id":"sh-5","title":"Connect Instagram, or import your numbers","duration":"4 min","status":"coming","video":"","resources":[],"notes":"## Direct connection (Claude desktop app)\n1. Install the Claude desktop app and sign in with the same account.\n2. Open CreatorHub inside the desktop app.\n3. Sidebar, Performance. Press \"Connect\" on the Instagram card, check your handle, press Connect.\n4. The app may ask you to allow CreatorHub to use the browser. Allow it.\n5. A browser window opens Instagram. If it shows a login page, sign in there once, then press \"Try again\" in CreatorHub.\n6. CreatorHub reads your profile and your Professional dashboard, saves the posts, tags the hooks and runs \"What's working\" by itself. Press Done.\n\nRepeat for TikTok and YouTube. Press \"Sync\" any time to refresh.\n\n## Import (any browser)\n1. Performance, Import.\n2. Paste a table copied from Instagram Insights, TikTok Studio or YouTube Studio, or drop up to six screenshots.\n3. Check the preview, press Import, then \"Tag hooks\".\n\nThe charts are the same either way."}]},{"title":"First wins","lessons":[{"id":"sh-3","title":"Your brand brain","duration":"3 min","status":"coming","video":"","resources":[],"notes":"Every script, edit, post and analysis starts from your profile. Spend three minutes here and everything else gets better.\n\n## Steps\n1. Sidebar, Settings. The Profile section is at the top.\n2. Niche: one sentence a stranger would understand. \"Tax relocation for UK founders paying over £25K a year\" beats \"finance content\".\n3. Audience: who watches and what they want from you this month.\n4. What the content sells: the call, the membership, the lead magnet. The CTA in every script points here.\n5. Style and tone: pick up to three. The assistant writes in this register.\n6. Notes: things you never say, topics to avoid, recurring series.\n\n## Check it worked\nWrite a script. If the hooks sound like you, the brain is right. If they sound generic, the niche or the offer is too vague."},{"id":"sh-6","title":"Study a competitor","duration":"3 min","status":"coming","video":"","resources":[],"notes":"## Steps\n1. Sidebar, Competitors, \"Add competitor\". Type the handle.\n2. In the desktop app, press \"Add and read their profile\". Their recent posts come in with views, likes, comments and hook types, and the analysis runs by itself.\n3. In a browser tab, press \"Add\", then \"Add posts\": paste captions with their numbers or drop screenshots of their grid, then press Analyze.\n4. Read \"What to steal\" and the hook types ranked by views. The five hooks at the bottom are written for your niche in their pattern. Press \"Write the script\" on the one you like."},{"id":"sh-7","title":"A script in one minute","duration":"3 min","status":"coming","video":"","resources":[],"notes":"## Steps\n1. Sidebar, Scripts. Type the topic in one line. Pick the format and, if you use one, the CTA keyword people comment.\n2. Press \"Write the script\". You get three hook options, the beats with on-screen text and B-roll notes, the call to action and the caption.\n3. Tap the hook you will open with.\n4. Press \"Make it sound like me\" if anything reads generic. It rewrites the words, not the structure.\n5. \"Add to planner\" puts it on the board with a due date. \"Copy\" gives you the text for your teleprompter.\n\n## The rule behind every script\nPlain speech: no run-ups, no fake contrasts, no hype words, no dashes. A number and a name beat an adjective."}]}]},{"id":"ai-for-creators","title":"AI for creators","subtitle":"Briefing, hooks, research, systems","level":"Core","hue":1,"order":2,"description":"How to brief Claude so the output sounds like you, the hook frameworks that keep working, competitor research as a weekly habit, and story sequences that sell.","modules":[{"title":"Briefing","lessons":[{"id":"ai-1","title":"How to brief Claude for content","duration":"7 min","status":"coming","video":"","notes":"A good brief has four parts. CreatorHub builds the first two for you; you add the rest.\n\n- Context: who you are, who it is for, what it sells. That is the brand brain.\n- Constraint: format, length, platform, what to avoid. “A 30-second reel, face to camera, no hashtags.”\n- Format: what the answer should look like. “Five hooks, each with the spoken line and the on-screen text.”\n- Example: one piece you loved, pasted in. The fastest way to get your voice back out.\n\n## Three habits\n\n1. Ask for options, then pick. Ten hooks and one choice beats one hook and four rewrites.\n2. Give it your numbers. “My top three reels were all objection hooks” changes everything it writes next.\n3. Edit the last 10%. If it reads like a template, cut the first sentence and the last.","resources":[]},{"id":"ai-2","title":"Hook frameworks that work","duration":"8 min","status":"coming","video":"","notes":"The first three seconds decide whether the rest exists. Five frameworks cover most of what performs:\n\n- Myth-bust: “This is what people don’t understand about…” Then correct it honestly.\n- Objection: name the fear, disarm it with a story, pivot to the reality.\n- Contrast: two numbers, one breath. “280 views as text. 5,900 face to camera.”\n- Story open: start mid-scene with something unexpected, then land the point.\n- Result proof: the outcome first, the system second, the ask last.\n\n## Spoken vs on-screen\n\nWrite both. The spoken line can be a full sentence; the on-screen text is eight words or fewer and should work with the sound off.\n\nThe Library tab in Scripts & Hooks holds the full structures with examples.","resources":[]}]},{"title":"Research and systems","lessons":[{"id":"ai-3","title":"Competitor research with AI","duration":"6 min","status":"coming","video":"","notes":"Research is not copying. You are collecting patterns: what hook types a creator uses, how they structure a piece, what the CTA asks for, how often they post.\n\n## The weekly habit\n\n1. Pick three accounts in your niche that are one step ahead of you.\n2. Add their top posts of the week to Competitors. Screenshots are enough; Claude reads the caption and numbers.\n3. Press Analyze. You get hook types ranked by views, the frameworks they lean on, the CTA pattern and five hooks adapted to your niche.\n4. Put one of those hooks into next week’s plan.\n\n## What to steal and what to leave\n\nSteal structure, pacing and the ask. Leave the wording and the story; those are theirs and your audience can tell.","resources":[]},{"id":"ai-4","title":"A weekly content system","duration":"6 min","status":"coming","video":"","notes":"Consistency is a schedule, not a personality trait.\n\n- Monday: plan. Open the Tracker, create the week’s pieces, set due dates. Twenty minutes.\n- Tuesday: script. Hooks and beats for every piece. Claude drafts, you choose.\n- Wednesday: film. Batch everything in one session, A-roll first, then B-roll.\n- Thursday: edit. Auto-edit each clip, revise by chat, export.\n- Friday: schedule. Captions, covers, posting times.\n\n## Stay one ahead\n\nAlways have next week’s pieces in Editing before this week’s go live. The buffer is what keeps you posting when life happens.","resources":[]},{"id":"ai-5","title":"Story sequences that sell","duration":"5 min","status":"coming","video":"","notes":"A story sequence is five to eight frames with one job. The Stories module writes and designs it from a brief.\n\n## The six-frame structure\n\n1. Hook: the promise or the question.\n2. Problem: what they have tried and why it did not stick.\n3. Lesson: the one idea.\n4. Proof: a number, a screenshot, a line from a client.\n5. Offer: what you have and who it is for.\n6. CTA: one action. Reply, tap the link, comment a word.\n\n## Variations\n\n- “New here?” series: numbered lessons for new followers, one idea each.\n- Live-session funnel: promise, three objections removed, watch.\n- Poll frames: a two-option question that doubles as audience research.","resources":[]}]}]},{"id":"the-editor","title":"The editor","subtitle":"Cuts, captions, hooks, export","level":"Core","hue":2,"order":3,"description":"The editing decisions that change retention, and how to make them with the AI Editor in minutes instead of hours.","modules":[{"title":"Retention","lessons":[{"id":"ed-1","title":"Cuts and pacing","duration":"7 min","status":"coming","video":"","notes":"Retention is mostly about what you remove.\n\n- Cut the breath before every sentence. Half a second each, dozens per minute.\n- Cut the repeat. If you said it twice, keep the better take.\n- Pattern interrupt every three to five seconds: a cut, a zoom, a B-roll shot, an on-screen word.\n- Jump cuts are fine. Smooth transitions are not the goal; momentum is.\n\n## In the editor\n\nPaste a transcript with timestamps and ask: “cut the dead air and the repeats”. Review the segments under the timeline, restore anything it cut too tight. The split and trim buttons do the rest by hand.","resources":[]},{"id":"ed-2","title":"Captions that retain","duration":"6 min","status":"coming","video":"","notes":"Most people watch with the sound off for the first seconds. Captions are the audio.\n\n- Three to five words per caption. Long lines get skimmed.\n- Highlight the one word that matters in each line. The editor does this with the accent colour.\n- Keep captions above the Instagram UI: the bottom 20% of the frame is covered by the caption and buttons.\n- Match the voice: if you swear, the caption swears.\n\n## In the editor\n\nCaptions tab: edit any line, nudge the timing with the offset slider, change the style. Ask Claude: “shorter captions, two words each” and it re-chunks them.","resources":[]},{"id":"ed-3","title":"Hooks on screen","duration":"5 min","status":"coming","video":"","notes":"The on-screen hook is the text on the first frame. It is the thumbnail, the headline and the reason to keep watching.\n\n- Eight words or fewer.\n- Visible from 0.0 to about 2.5 seconds, then gone.\n- High contrast: a filled pill or bold white with a shadow. Never thin text on a busy background.\n- It can differ from the spoken hook. The spoken line sets up; the on-screen line pays off.\n\nAsk the editor for three options and pick one. Then export a cover frame from the same moment so the grid matches.","resources":[]}]},{"title":"Finish","lessons":[{"id":"ed-4","title":"B-roll and screen recordings","duration":"5 min","status":"coming","video":"","notes":"B-roll covers cuts and proves claims.\n\n- Show the thing. If you talk about the dashboard, show the dashboard.\n- Keep B-roll shots under two seconds unless the shot is the point.\n- Screen recordings: zoom to the part that matters, hide notifications, record at the final aspect ratio.\n- Proof shots (results, messages, numbers) earn more than any sentence.\n\nIn the editor, ask for an on-screen note list: it tells you where B-roll would help, by timestamp.","resources":[]},{"id":"ed-5","title":"Export for each platform","duration":"4 min","status":"coming","video":"","notes":"- Reels, TikTok, Shorts: 9:16, 1080×1920. Keep under 60 seconds unless the story needs more.\n- YouTube long-form: 16:9, 1920×1080. Chapters in the description.\n- LinkedIn: square or vertical both work; captions are mandatory.\n\n## From the editor\n\nExport renders in your browser. Pick 720p for a quick review copy or 1080p for the final, then save the file. The browser export is WebM or MP4 depending on your device; the hosted version renders MP4 on the server at full bitrate.","resources":[]}]}]},{"id":"content-strategy","title":"Content strategy","subtitle":"Calendar, formats, funnels, analytics","level":"Advanced","hue":3,"order":4,"description":"The 12-week calendar, which format does which job, comment-keyword funnels, and the weekly review that turns numbers into next week’s plan.","modules":[{"title":"Plan","lessons":[{"id":"cs-1","title":"The 12-week calendar","duration":"8 min","status":"coming","video":"","notes":"Twelve weeks is long enough to see patterns and short enough to stay honest.\n\n## The weekly rhythm\n\n- One reel with a clear hook framework.\n- One aesthetic or carousel post that holds the grid together.\n- One community post: a member, a client, an event, a win.\n- One filming day that covers all of the above.\n- Every six weeks: one long-form video.\n\n## Themes by week\n\nGive each week a theme (origin, contrarian take, business tool, pricing, partners, the close) so the pieces build an argument instead of a random feed.\n\nIn the Tracker, create the twelve weeks as pieces with due dates. Move them along as you go.","resources":[]},{"id":"cs-2","title":"Formats and what each one is for","duration":"6 min","status":"coming","video":"","notes":"- Reel: reach. New people. One idea, one hook, one CTA.\n- Carousel: depth and saves. Proof, steps, numbers. The last slide is the ask.\n- Story: trust and conversion. Daily, raw, sequences that sell.\n- YouTube: authority. Longer arguments, documentary episodes, the VSL.\n- Static post: the grid. Editorial portraits, event moments, detail shots.\n\nPlan the mix by job. If leads are the goal, reels bring them and stories close them.","resources":[]}]},{"title":"Convert","lessons":[{"id":"cs-3","title":"Comment-keyword funnels","duration":"6 min","status":"coming","video":"","notes":"“Comment WORD and I’ll send you…” is the highest-leverage CTA in short-form.\n\n- The word matches the thing: SYSTEM for the system, PIF for the paid-in-full breakdown.\n- The promise is specific: a document, a video, a link, a call.\n- Qualify the ask to filter for intent: “comment if you post twice a week and still can’t predict your views.”\n- Automate the DM reply, then follow up by hand with the ones who answer.\n\nTrack the keyword in the Tracker on each piece, so you can see which pieces produced conversations and not just views.","resources":[]},{"id":"cs-4","title":"Reading your analytics","duration":"7 min","status":"coming","video":"","notes":"Three numbers matter. Everything else is context.\n\n- Views: did the hook work?\n- Saves and shares: was it worth keeping?\n- Replies and keyword comments: did it start a conversation?\n\n## The weekly review\n\nEvery Friday open Performance. Sort by views. Read the top three and the bottom three. Ask Claude to explain the gap. Then put one repeat and one experiment into next week’s plan.\n\nTag hook types so the chart tells you which framework your audience rewards. That is the only test that matters.","resources":[]},{"id":"cs-5","title":"From content to clients","duration":"6 min","status":"coming","video":"","notes":"Content earns attention. The offer turns it into revenue.\n\n- Authority first: the feed should make the call feel like the obvious next step.\n- The VSL: one long video that explains who it is for, what it is, and what happens next. Pin it.\n- The offer is one sentence. If you cannot say it, they cannot buy it.\n- The call: book it through a form that asks two qualifying questions.\n\nLink the pieces: reels to stories, stories to the VSL, the VSL to the call. In CreatorHub, every piece can carry the CTA keyword and the funnel step it feeds.","resources":[]}]}]}];
const LIBRARY_SEED = [{"id":"myth-bust","name":"Myth-bust","kind":"hook","structure":"Name the belief everyone repeats → show the gap it hides → correct it honestly, costs included → one next step","bestFor":"Expert niches where misleading advice is common (tax, fitness, business, health)","hookLine":"This is what people don’t understand about…","example":"Everyone says you need to post every day. Here’s what actually moved the needle for me, and it wasn’t volume.","notes":"Works because the honesty is the sell. Say what it really costs and who it is not for. Face-to-camera beats text-only on the same idea by a wide margin.","order":1},{"id":"objection","name":"Objection-bust","kind":"hook","structure":"State the number-one fear out loud → disarm with an unexpected story or analogy → pivot: “but here’s the reality” → proof → normalize","bestFor":"Offers people hesitate on: money, relocation, big purchases, new tools","hookLine":"Do you think [the scary thing] is actually safe?","example":"Is it safe to let AI touch your footage? Here’s what happened the first time I let it cut a client reel.","notes":"Name the exact hesitation your DMs keep raising. Use a real historical fact as the proof beat, then land on “it’s just new, and new brings fear.”","order":2},{"id":"contrast","name":"Contrast / number","kind":"hook","structure":"Before number → after number in one breath → reframe the gap as a system change, not more work → CTA keyword","bestFor":"Any outcome you can put a number on: views, revenue, time saved, tax paid","hookLine":"Make X here, you keep Y. Make X there, you keep X.","example":"Last month this account did 280 views on a text reel and 5,900 on the same idea face to camera. Same topic. Different delivery.","notes":"The gap must be visceral. Pair it with a human on screen: pure text versions of this hook underperform the spoken version 5 to 10 times.","order":3},{"id":"story-analogy","name":"Story → analogy → point","kind":"hook","structure":"Open mid-story with something unexpected → the analogy lands the idea → self-correct (“that was a silly answer, right? but…”) → the real point → one proof","bestFor":"Dry topics that need a pattern interrupt before the lesson","hookLine":"I live down a private road with five houses…","example":"My neighbour parks two sports cars outside. I park a scooter. Guess whose house gets broken into. That’s how I think about where the attention goes on a feed.","notes":"Fast pace in the story, slow down on the point. The self-correction is the trust move: you show the audience you know it was a joke.","order":4},{"id":"proof-carousel","name":"Result proof carousel","kind":"format","structure":"Slide 1: the result and a date → slides 2–4: the system in numbers, a client case, the margin → slide 5: “I recorded a breakdown on…” → slide 6: comment keyword CTA","bestFor":"Carousels that turn proof into DMs","hookLine":"Bought my dream car at 21. Here’s the business behind it.","example":"75% of sales closed in DMs. No guarantees, all paid in full. A 4-person team at a 79% margin. Comment PIF and I’ll send the breakdown.","notes":"Every slide carries one number. The last slide is the only ask. Keep the photos candid, not stock.","order":5},{"id":"new-here","name":"“New here?” lesson series","kind":"format","structure":"Numbered lesson for new followers → “You might… you might have…” → “but you don’t have [the predictable thing]” → one principle in quotes","bestFor":"Stories and pinned posts that onboard new followers to your point of view","hookLine":"New here? Lesson 2: Predictability.","example":"You might run ads. You might have got a few clients from them. But you don’t have a way to predictably get 300 qualified followers a day. “When you can predict, you can scale.”","notes":"Keep each lesson to one idea. Number them so people binge. Reuse the frame weekly.","order":6},{"id":"comment-keyword","name":"Comment-keyword CTA","kind":"cta","structure":"Name one word → promise the exact thing they get → qualify who should comment","bestFor":"Every reel or carousel whose job is leads","hookLine":"Comment “WORD” and I’ll send you…","example":"Comment SYSTEM if you post more than twice a week and still can’t predict your views. I’ll send the exact weekly plan.","notes":"The word should match the thing (DUBAI, PIF, SYSTEM). Qualify the ask (“if you’re paying over £25K in tax”) to filter for intent. Pair with DM automation.","order":7},{"id":"documentary","name":"Documentary episode","kind":"format","structure":"Interview spine → real in-the-moment footage of the thing being built → one tension per episode → end on what happens next","bestFor":"Founder-led YouTube series; 10–20 minute standalone episodes","hookLine":"Episode 3: the week the deal nearly fell through","example":"Not vloggy, not staged. Capture what is actually happening while it happens, then cut it around one question per episode.","notes":"Shoot four episodes per trip. Keep one edited episode in the buffer before weekly releases start. Pull clips for short-form from every episode.","order":8},{"id":"story-funnel","name":"Live-session story funnel","kind":"format","structure":"Promise frame → remove the three objections in three frames (“you don’t need an audience / experience / to show your face”) → repeat the one thing → watch CTA with link","bestFor":"Selling a live session, a webinar or the next episode of a series through Stories","hookLine":"Today I’m sharing a new way to…","example":"You don’t need to build an audience. You don’t need experience. If you want to make this work without showing your face, you’ll love this one. Watch the live session →","notes":"One idea per frame, big text, high contrast. End on a frame that is only the CTA.","order":9},{"id":"lifestyle-curiosity","name":"Day-in-the-life curiosity","kind":"hook","structure":"Lifestyle visual → never say what the business is → let comments ask → answer in the DMs or a later reel","bestFor":"Lifestyle-led accounts building curiosity before a reveal","hookLine":"Day in the life on the coast. Morning missions first.","example":"Morning run, two calls, one shoot. Nobody in the comments knows what I actually do, and that is the point.","notes":"The curiosity is the asset. Monetize it later with a reveal series or a comment-keyword offer.","order":10}];

function parseCues(text){
  const out = []; const lines = String(text || "").split(/\r?\n/);
  const toS = s => { const m = s.match(/(?:(\d+):)?(\d{1,2}):(\d{2})(?:[.,](\d{1,3}))?/); if (!m) return null; return (Number(m[1] || 0) * 3600) + Number(m[2]) * 60 + Number(m[3]) + (m[4] ? Number((m[4] + "00").slice(0, 3)) / 1000 : 0); };
  for (let i = 0; i < lines.length; i++){
    const l = lines[i].trim(); if (!l) continue;
    const arrow = l.match(/^(.+?)\s*-->\s*(.+?)$/);
    if (arrow){ const s = toS(arrow[1]), e = toS(arrow[2]); const txt = []; let j = i + 1; while (j < lines.length && lines[j].trim() && !/-->/.test(lines[j])){ txt.push(lines[j].trim()); j++; } if (s != null && txt.length) out.push({s, e:e != null ? e : s + 3, text:txt.join(" ")}); i = j; continue; }
    const pre = l.match(/^[\[(]?((?:\d+:)?\d{1,2}:\d{2}(?:[.,]\d{1,3})?)[\])]?\s*[-–:]?\s*(.+)$/);
    if (pre){ const s = toS(pre[1]); if (s != null && pre[2] && !/^\d+$/.test(pre[2])) out.push({s, e:null, text:pre[2].trim()}); }
  }
  out.sort((a, b) => a.s - b.s);
  for (let i = 0; i < out.length; i++) if (out[i].e == null) out[i].e = i + 1 < out.length ? out[i + 1].s : out[i].s + Math.max(1.5, words(out[i].text).length / 2.6);
  return out;
}
function transcriptBlock(){

function loadSharedSeeds(){
  if (!S.shared.academy.size) ACADEMY_SEED.forEach(c => S.shared.academy.set(c.id, c));
  if (!S.shared.library.size) LIBRARY_SEED.forEach(x => S.shared.library.set(x.id, x));
}
function enterDemo(reason){
  S.mode = "demo"; S.demoReason = reason; S.profile = null; loadSharedSeeds(); render();
}
function subscribeShared(db){
  for (const col of ["academy","library"]){
    db.collection(col).onSnapshot(snap => {
      if (snap.metadata.fromCache && snap.empty) return;
      const m = new Map(); for (const d of snap.docs) if (d.exists) m.set(d.id, {id:d.id, ...d.data()});
      if (!m.size && !snap.metadata.fromCache){ const seed = col === "academy" ? ACADEMY_SEED : LIBRARY_SEED; seed.forEach(x => m.set(x.id, x)); }
      S.shared[col] = m; scheduleRender();
    }, () => { loadSharedSeeds(); scheduleRender(); });
  }
}
function subscribeUser(db){
  const root = userRoot(); let first = true; S.loaded = {};
  const slowT = setTimeout(() => { if (S.mode === "loading"){ S.mode = "live"; S.slow = true; render(); } else if (!S.profileLoaded){ S.slow = true; render(); } }, 10000);
  const onErr = e => { clearTimeout(slowT); if (e && e.code === "revoked"){ S.mode = "demo"; S.demoReason = "readonly"; } else if (S.mode === "loading") S.mode = "live"; render(); };
  db.doc(root + "/profile").onSnapshot(snap => {
    S.profile = snap.exists ? snap.data() : null;
    if (!snap.metadata.fromCache){ S.profileLoaded = true; S.slow = false; clearTimeout(slowT); }
    if (first || S.mode === "loading"){ first = false; S.mode = "live"; }
    scheduleRender(); maybeAutopilot(); purgeExamples();
  }, onErr);
  db.doc(root + "/progress").onSnapshot(snap => { S.progress = snap.exists ? snap.data() : {done:{}}; scheduleRender(); }, () => {});
  for (const col of USER_COLS){
    db.collection(root + "/ws/" + col).onSnapshot(snap => {
      const m = new Map(); for (const d of snap.docs) if (d.exists) m.set(d.id, {id:d.id, ...d.data()});
      S.col[col] = m; S.loaded[col] = true; scheduleRender(); maybeAutopilot(); purgeExamples();
    }, onErr);
  }
}
function purgeExamples(){
  if (S.purged || !S.profile || !S.profileLoaded || S.mode !== "live") return;
  if (S.profile.examplesOk){ S.purged = true; return; }
  if (!COLS.every(c => S.loaded[c])) return;
  S.purged = true;
  if (!hasExamples()) return;
  for (const col of COLS) for (const d of listCol(col)) if (d.example) remove(col, d.id);
  toast("Example data removed. Everything you see now is yours.");
}
function maybeAutopilot(){
  if (!FEATURES.posts) return;
  if (S.autoFilled || !S.profile || !S.profileLoaded || !S.loaded.queue || S.mode !== "live") return;
  const ap = autopilot(); if (!ap.on || !ap.auto || !claudeOK()) return;
  if (!plannedDates(7).some(d => !queueFor(d))) return;
  S.autoFilled = true;
  setTimeout(() => { fillQueue(7, {limit:3}); }, 1500);
}
(async function boot(){
  readHash();
  window.addEventListener("hashchange", () => { readHash(); closeAllLayers(); render(); window.scrollTo(0, 0); });
  document.addEventListener("keydown", e => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); if (S.profile) openAssistant(); }

  const use = n => { try { return Promise.resolve(C.use(n)).catch(() => null); } catch (e){ return Promise.resolve(null); } };

  }

  if (!db){ enterDemo("nodb"); return; }
  if (!S.meId){ enterDemo("nouser"); return; }
  if (S.canWrite === false){ enterDemo("readonly"); return; }
  subscribeUser(db);
  render();
